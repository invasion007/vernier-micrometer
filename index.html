<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游标卡尺与螺旋测微器 · 读数与原理 · 可交互课件</title>
<style>
  :root{
    /* A · Manim 基调：纯黑底 + 白线为主 + Manim 官方色常量
       蓝 = 主尺/固定刻度   红 = 游标/可动刻度   黄 = 总读数（结论量）
       一屏同屏彩色元素 ≤ 3 种；不使用渐变/霓虹/投影 */
    --bg:#000000; --bg2:#0a0a0a; --panel:#0e0e0e; --line:#242424; --line2:#383838;
    --ink:#FFFFFF; --ink2:#B0B0B0; --muted:#888888;
    --blue:#58C4DD; --red:#FC6255; --yellow:#FFFF00; --gold:#F0AC5F;
    --green:#83C167; --purple:#9A72AC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; overflow:hidden;}
  .app{display:grid; grid-template-rows:auto auto 1fr auto auto; height:100vh;}

  header{display:flex; align-items:baseline; gap:14px; padding:9px 18px 7px; flex-wrap:wrap; row-gap:3px;
    background:var(--bg2); border-bottom:1px solid var(--line);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap;}
  .act{font-size:13px; color:var(--yellow); border:1px solid var(--line2); border-radius:10px; padding:1px 9px; white-space:nowrap;}
  .steptitle{font-size:15px; color:var(--ink); font-weight:600;}
  .stepsn{margin-left:auto; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums;}

  .topnav{display:flex; align-items:center; gap:5px; padding:5px 14px 6px;
    background:var(--bg2); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;}
  .topnav .grouplab{flex:0 0 auto; font-size:11px; letter-spacing:.6px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .topnav .sep{flex:0 0 auto; width:1px; height:15px; background:var(--line2); margin:0 5px;}
  .topnav a{flex:0 0 auto; min-width:27px; height:22px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; cursor:pointer;}
  .topnav a:hover{background:#1e1e1e; color:var(--ink);}
  .topnav a.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}

  .stage{display:grid; grid-template-columns:1fr 296px; min-height:0;}
  .canvaswrap{position:relative; min-width:0; min-height:0; padding:6px 8px 0 8px;}
  canvas{display:block; width:100%; height:100%; cursor:grab; touch-action:none;}
  .hint{padding:6px 20px 0 20px; font-size:12.5px; color:var(--muted); min-height:32px;}
  .hint b{color:var(--yellow); font-weight:600;}

  aside{background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 14px; overflow-y:auto; min-height:0;}
  aside h3{font-size:12px; color:var(--muted); margin:13px 0 6px; font-weight:600; letter-spacing:.5px;}
  aside h3:first-child{margin-top:2px;}
  .rd{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:3px 0;
    font-size:12.5px; color:var(--ink2); border-bottom:1px dashed #242424;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:14px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rd b.blue{color:var(--blue);} .rd b.red{color:var(--red);}
  .rd b.yellow{color:var(--yellow);} .rd b.gold{color:var(--gold);} .rd b.grey{color:var(--muted);}
  .total{margin-top:8px; padding:8px 10px; border:1px solid var(--line2); border-radius:8px; background:#141414;}
  .total .lab{font-size:12px; color:var(--muted); display:block; margin-bottom:2px;}
  .total b{font-size:19px; color:var(--yellow); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.5px;}
  .formula{font-size:13.5px; color:var(--ink); background:#141414; border:1px solid var(--line2);
    border-radius:8px; padding:8px 10px; line-height:1.6; word-break:break-word;}
  .note{font-size:12.5px; color:var(--ink2); line-height:1.66;}
  .note b{color:var(--yellow); font-weight:600;}
  .grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .grp .lab{font-size:12.5px; color:var(--muted);}
  button{font-family:inherit; font-size:12.5px; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap;}
  button:hover{background:#1e1e1e; color:var(--ink);}
  button.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}
  button.main{background:#1a1a1a; color:var(--ink);}
  button.warn{background:#1a1a1a; color:var(--gold);}

  .quiz{margin-top:6px;}
  .quiz input{width:100%; font-family:inherit; font-size:15px; font-variant-numeric:tabular-nums;
    color:var(--yellow); background:#141414; border:1px solid var(--line2); border-radius:6px;
    padding:6px 9px; outline:none;}
  .quiz input:focus{border-color:var(--yellow);}
  .qdec{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .qmsg{font-size:12px; margin-top:6px; line-height:1.5; color:var(--ink2);}
  .qmsg.ok{color:var(--green);} .qmsg.bad{color:var(--red);}
  .qans{font-size:13px; color:var(--yellow); margin-top:5px; font-variant-numeric:tabular-nums;}

  footer{display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;
    padding:8px 14px 9px; background:var(--bg2); border-top:1px solid var(--line);}
  .bar{position:relative; flex:1 1 120px; min-width:80px; height:6px; background:#141414; border-radius:3px;}
  .bar i{display:block; height:100%; width:0; background:var(--yellow); border-radius:3px;}
  .slider{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
  .slider input[type=range]{width:132px; accent-color:#4a4a4a;}
  .slider b{color:var(--ink); font-variant-numeric:tabular-nums; min-width:62px; text-align:right;}
  .hidden{display:none !important;}

  @media (max-width: 900px){
    .stage{grid-template-columns:1fr; grid-template-rows:1fr auto;}
    aside{border-left:none; border-top:1px solid var(--line); max-height:30vh;}
    .hint{font-size:12px;}
    header h1{font-size:14px;} .steptitle{font-size:13px;}
    .slider input[type=range]{width:88px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>游标卡尺 &amp; 螺旋测微器</h1>
    <span class="act" id="actTag">第一幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 22</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3 id="rdHead1">主尺读数</h3>
      <div id="rdGroup1"></div>
      <h3 id="rdHead2">游标尺读数</h3>
      <div id="rdGroup2"></div>
      <div class="total"><span class="lab">总读数</span><b id="rdTotal">—</b></div>

      <div id="quizPane" class="quiz hidden">
        <h3>你的读数（mm）</h3>
        <input id="quizIn" type="text" inputmode="decimal" autocomplete="off" placeholder="例 7.30">
        <div class="qdec" id="quizDec"></div>
        <div class="grp" style="margin-top:7px">
          <button id="btnQuizCheck" class="main">核对</button>
          <button id="btnQuizAns" class="warn">显示答案</button>
        </div>
        <div class="qmsg" id="quizMsg"></div>
        <div class="qans hidden" id="quizAns"></div>
      </div>

      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>提示</h3>
      <div class="note" id="rdNote"></div>
      <div class="note" style="margin-top:6px;color:#888888">键盘 ← → 翻步；画布上直接<b style="color:#F0AC5F">拖动</b>也能移动游标尺 / 微分筒。</div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev">◀ 上一步</button>
    <button id="btnNext" class="main">下一步 ▶</button>
    <button id="btnReset">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>

    <div class="slider" id="wrap_x"><span id="lbXLab">游标零线位置</span>
      <input type="range" id="rgX" min="0" max="21" step="0.02" value="7.3"><b id="lbX">7.30 mm</b></div>
    <div class="slider" id="wrap_zoom"><span>放大倍数</span>
      <input type="range" id="rgZoom" min="1" max="4" step="0.5" value="1"><b id="lbZoom">×1.0</b></div>

    <div class="grp" id="wrapDivBtn"><span class="lab">分度</span>
      <button data-div="10">10 分度</button>
      <button data-div="20">20 分度</button>
      <button data-div="50">50 分度</button>
      <span class="lab" id="lbDiv">10 分度</span>
    </div>

    <div class="grp" id="wrapFine"><span class="lab">微调</span>
      <button data-d="-0.01">−0.01</button>
      <button data-d="0.01">+0.01</button>
      <button data-d="-0.001">−0.001</button>
      <button data-d="0.001">+0.001</button>
    </div>

    <div class="grp" id="wrapZoomBtn"><span class="lab">缩放</span>
      <button data-z="in">放大 +</button>
      <button data-z="out">缩小 −</button>
      <button data-z="reset">重置</button>
    </div>

    <div class="grp" id="wrapKnob"><span class="lab">旋钮</span>
      <button data-knob="coarse">粗调（上/下拖）</button>
      <button data-knob="fine">微调（上/下拖）</button>
    </div>

    <div class="grp" id="wrapQuizBtn">
      <button id="btnQuizNew" class="main">随机出题</button>
    </div>
  </footer>
</div>

<script>


window.VizPhys = (function () {
'use strict';

var VERNIER = {
10: { k: 10, precision: 0.1,  dec: 1, span: 9  },
20: { k: 20, precision: 0.05, dec: 2, span: 19 },
50: { k: 50, precision: 0.02, dec: 2, span: 49 }
};
var DIVS = [10, 20, 50];
var CAL_XMAX = 21;
var CAL_MM   = 150;

function vcfg(div) { return VERNIER[div] || VERNIER[10]; }

function caliperSpan(div) { return vcfg(div).span + CAL_XMAX; }

function vernier(x, div) {
var c = vcfg(div), k = c.k;
if (!(x >= 0)) { x = 0; }
if (x > CAL_MM) { x = CAL_MM; }
var L = Math.floor(x + 1e-9);
var frac = x - L;
var n = Math.round(frac * k);
if (n >= k) { n = 0; L += 1; }
var vLine = x + n * (k - 1) / k;
var mLine = L + n;
return {
div: div, k: k, precision: c.precision, dec: c.dec, span: c.span,
x: x, mainMM: L, idx: n, vernierMM: n / k, total: L + n / k,
vLine: vLine, mLine: mLine, residual: vLine - mLine
};
}

function fmtCaliper(r) { return r.total.toFixed(r.dec); }

var MIC_MAX   = 12;
var MIC_PITCH = 0.5;
var MIC_DIV   = 50;

function micro(x) {
if (!(x >= 0)) { x = 0; }
if (x > MIC_MAX) { x = MIC_MAX; }
var xm = Math.round(x * 1000);
var half = Math.floor(xm / 500);
var rem  = xm - half * 500;
var div  = Math.floor(rem / 10);
var est  = rem % 10;
return {
x: xm / 1000, xm: xm,
half: half, fixedMM: half * 0.5,
div: div, movableMM: div * 0.01,
est: est, estMM: est * 0.001,
total: xm / 1000,
phase: rem / 500,
tight: rem < 50
};
}

function fmtMicro(r) { return r.total.toFixed(3); }

function mulberry32(a) {
return function () {
a |= 0; a = a + 0x6D2B79F5 | 0;
var t = Math.imul(a ^ a >>> 15, 1 | a);
t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
}
function rndInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function rndIntS(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }

function newCaliper(div) {
var c = vcfg(div);
var L = rndInt(1, CAL_XMAX - 1);
var n = rndInt(1, c.k - 1);
return L + n / c.k;
}

function newMicro() {
return rndInt(100, MIC_MAX * 1000 - 100) / 1000;
}

function newObject(inst, seed) {
var rng = mulberry32((seed >>> 0) || 1);
if (inst === 'micrometer') {
return Math.round((0.3 + rng() * 1.3) * 1000) / 1000;
}
return Math.round((5 + rng() * 35) * 100) / 100;
}

function newObjectCaliper(div, seed) {
var c = vcfg(div), rng = mulberry32((seed >>> 0) || 1);
var whole = 5 + Math.floor(rng() * 35);
var n = 1 + Math.floor(rng() * (c.k - 1));
return Math.round((whole + n / c.k) * 100) / 100;
}

function newCaliperS(div, seed) {
var c = vcfg(div), rng = mulberry32(seed >>> 0);
var L = rndIntS(rng, 1, CAL_XMAX - 1);
var n = rndIntS(rng, 1, c.k - 1);
return L + n / c.k;
}
function newMicroS(seed) {
var rng = mulberry32(seed >>> 0);
return rndIntS(rng, 100, MIC_MAX * 1000 - 100) / 1000;
}

function diagnoseCaliper(got, r) {
if (!isFinite(got)) { return { ok: false, kind: 'empty', msg: '还没有填读数' }; }
if (Math.abs(got - r.total) < 1e-6) {
return { ok: true, kind: 'ok', msg: '读数正确' };
}
var gL = Math.floor(got + 1e-9), gFrac = got - gL;
var gN = Math.round(gFrac * r.k);
if (gN >= r.k) { gN = 0; gL += 1; }
if (gL !== r.mainMM) {
return { ok: false, kind: 'main',
msg: '主尺读数错：游标 0 线左边最近的主尺刻度是 ' + r.mainMM +
' mm，你读的是 ' + gL + ' mm' };
}
if (gN !== r.idx) {
return { ok: false, kind: 'vernier',
msg: '游标读数错：与主尺对齐的是第 ' + r.idx + ' 条线，你数成了第 ' + gN + ' 条' };
}
return { ok: false, kind: 'other', msg: '再核对一遍' };
}

function diagnoseMicro(got, r) {
if (!isFinite(got)) { return { ok: false, kind: 'empty', msg: '还没有填读数' }; }
if (Math.abs(got - r.total) < 5e-4) {
return { ok: true, kind: 'ok', msg: '读数正确' };
}
var gm = Math.round(got * 1000);
var gHalf = Math.floor(gm / 500);
var gRem = gm - gHalf * 500;
var gDiv = Math.floor(gRem / 10);
if (gHalf !== r.half) {
return { ok: false, kind: 'fixed',
msg: '固定刻度错：露出的最后一条刻度是 ' + r.fixedMM.toFixed(1) +
' mm，你读的是 ' + (gHalf * 0.5).toFixed(1) + ' mm' +
(Math.abs(gHalf - r.half) === 1 ? '（多半是半毫米线看漏/看多了）' : '') };
}
if (gDiv !== r.div) {
return { ok: false, kind: 'movable',
msg: '可动刻度错：基准线对着第 ' + r.div + ' 格，你读的是第 ' + gDiv + ' 格' };
}
return { ok: false, kind: 'est', msg: '格数对了，只差估读位 —— 再看一眼基准线落在格内的位置' };
}

function runSelfTest() {
var fails = [], cases = 0;
function chk(cond, msg) { cases++; if (!cond) { fails.push(msg); } }

DIVS.forEach(function (div) {
var c = vcfg(div), k = c.k, i, x, r;
for (i = 0; i <= 420; i++) {
x = i * 0.05 + 0.031;
if (x > CAL_XMAX) { break; }
r = vernier(x, div);
chk(Math.abs(r.total - x) <= c.precision / 2 + 1e-9,
'卡尺量化误差超标 div=' + div + ' x=' + x.toFixed(4) + ' got=' + r.total.toFixed(4));
chk(Math.abs(r.residual) <= 1 / (2 * k) + 1e-9,
'对齐残差超标 div=' + div + ' x=' + x.toFixed(4) + ' res=' + r.residual);
chk(Math.abs(r.mainMM + r.idx / k - r.total) < 1e-9,
'分解式不符 div=' + div + ' x=' + x.toFixed(4));
chk(r.idx >= 0 && r.idx < k, '对齐序号越界 div=' + div + ' idx=' + r.idx);
chk(r.mainMM >= 0, '主尺读数为负');
}
});

var e1 = vernier(10.3, 10);
chk(e1.mainMM === 10 && e1.idx === 3 && Math.abs(e1.total - 10.3) < 1e-9,
'教材例：10 分度 10.3 mm');
var e2 = vernier(6.55, 20);
chk(e2.mainMM === 6 && e2.idx === 11 && Math.abs(e2.total - 6.55) < 1e-9,
'教材例：20 分度 6.55 mm');
var e3 = vernier(3.80, 50);
chk(e3.mainMM === 3 && e3.idx === 40 && Math.abs(e3.total - 3.8) < 1e-9,
'教材例：50 分度 3.80 mm');

var i2, x2, r2;
for (i2 = 0; i2 <= MIC_MAX * 1000; i2 += 7) {
x2 = i2 / 1000;
r2 = micro(x2);
chk(Math.abs(r2.fixedMM + r2.movableMM + r2.estMM - r2.total) < 1e-9,
'螺旋分解式不符 x=' + x2);
chk(r2.div >= 0 && r2.div <= 49, '可动刻度越界 x=' + x2 + ' div=' + r2.div);
chk(r2.est >= 0 && r2.est <= 9, '估读越界 x=' + x2 + ' est=' + r2.est);
chk(Math.abs(r2.total - x2) < 1e-9, '往返不符 x=' + x2);
chk(Math.abs(r2.fixedMM + r2.phase * MIC_PITCH - r2.total) < 1e-9,
'转角相位不符 x=' + x2);
}

var m1 = micro(5.960);
chk(m1.half === 11 && m1.fixedMM === 5.5 && m1.div === 46 && m1.est === 0,
'教材例：5.5 + 46×0.01 = 5.960 mm');
var m2 = micro(4.500);
chk(m2.half === 9 && m2.fixedMM === 4.5 && m2.div === 0 && m2.est === 0,
'教材例：4.500 mm（半毫米线刚露）');
var m3 = micro(0.000);
chk(m3.half === 0 && m3.div === 0 && m3.est === 0, '零点：0.000 mm');
var m4 = micro(12);
chk(m4.half === 24 && m4.div === 0, '量程上限：12.000 mm');

var t;
for (t = 0; t < 300; t++) {
var cx = newCaliper(50);
chk(cx >= 0 && cx <= CAL_XMAX, '卡尺出题越界 ' + cx);
var cr = vernier(cx, 50);
chk(Math.abs(cr.total - cx) < 1e-9, '卡尺出题不能完美对齐 ' + cx);
var mx = newMicro();
chk(mx >= 0 && mx <= MIC_MAX, '螺旋出题越界 ' + mx);
}

return { pass: fails.length === 0, cases: cases, fails: fails.slice(0, 12), nfail: fails.length };
}

return {
VERNIER: VERNIER, DIVS: DIVS, CAL_XMAX: CAL_XMAX, MIC_MAX: MIC_MAX,
MIC_PITCH: MIC_PITCH, MIC_DIV: MIC_DIV,
vcfg: vcfg, caliperSpan: caliperSpan, vernier: vernier, fmtCaliper: fmtCaliper,
micro: micro, fmtMicro: fmtMicro,
newCaliper: newCaliper, newMicro: newMicro, newObject: newObject,
newObjectCaliper: newObjectCaliper, CAL_MM: CAL_MM,
newCaliperS: newCaliperS, newMicroS: newMicroS, mulberry32: mulberry32,
diagnoseCaliper: diagnoseCaliper, diagnoseMicro: diagnoseMicro,
runSelfTest: runSelfTest
};
})();



window.VizRender = (function () {
'use strict';

var FONT = '"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif';
var C = {
bg: '#000000', white: '#FFFFFF', grey: '#888888',
yellow: '#FFFF00', red: '#FC6255', blue: '#58C4DD',
green: '#83C167', gold: '#F0AC5F', purple: '#9A72AC', teal: '#5CD0B3'
};

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

function rrect(ctx, x, y, w, h, r) {
r = Math.min(r, w / 2, h / 2);
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.arcTo(x + w, y, x + w, y + h, r);
ctx.arcTo(x + w, y + h, x, y + h, r);
ctx.arcTo(x, y + h, x, y, r);
ctx.arcTo(x, y, x + w, y, r);
ctx.closePath();
}

function txt(ctx, s, x, y, o) {
o = o || {};
ctx.save();
ctx.font = (o.weight || 400) + ' ' + (o.size || 12) + 'px ' + (o.face || FONT);
ctx.fillStyle = o.color || C.white;
ctx.textAlign = o.align || 'center';
ctx.textBaseline = o.base || 'middle';
if (o.alpha != null) { ctx.globalAlpha = o.alpha; }
ctx.fillText(s, x, y);
ctx.restore();
}

function seg(ctx, x0, y0, x1, y1, color, w, dash, alpha) {
ctx.save();
ctx.strokeStyle = color; ctx.lineWidth = w || 1.4;
ctx.lineCap = 'butt';
if (dash) { ctx.setLineDash(dash); }
if (alpha != null) { ctx.globalAlpha = alpha; }
ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
ctx.restore();
}

function box(ctx, x, y, w, h, o) {
o = o || {};
ctx.save();
if (o.fill) { ctx.fillStyle = o.fill; ctx.fillRect(x, y, w, h); }
if (o.stroke) {
ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 1.4;
if (o.dash) { ctx.setLineDash(o.dash); }
ctx.strokeRect(x, y, w, h);
}
ctx.restore();
}

function dot(ctx, x, y, r, color, alpha) {
ctx.save();
ctx.fillStyle = color; if (alpha != null) { ctx.globalAlpha = alpha; }
ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}

function glow(ctx, x, y, r, color) {
ctx.save();
ctx.shadowColor = color; ctx.shadowBlur = 10;
ctx.fillStyle = color; ctx.globalAlpha = 0.45;
ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}

function halo(ctx, x, y, r, color) {
ctx.save();
ctx.globalAlpha = 0.16; ctx.fillStyle = color;
ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}

function head(ctx, W, title, sub) {
txt(ctx, title, 22, 24, { size: 16, color: C.white, weight: 600, align: 'left' });
if (sub) { txt(ctx, sub, 22, 46, { size: 12, color: C.grey, align: 'left' }); }
}

function legend(ctx, W, y, items) {
var gap = 22, i, w = [], tw = 0;
ctx.save(); ctx.font = '12px ' + FONT;
for (i = 0; i < items.length; i++) { w.push(ctx.measureText(items[i].t).width + 18); tw += w[i] + gap; }
ctx.restore();
var x = Math.max(22, W - 22 - tw + gap);
for (i = 0; i < items.length; i++) {
dot(ctx, x + 5, y, 4, items[i].c);
txt(ctx, items[i].t, x + 13, y, { size: 12, color: C.grey, align: 'left' });
x += w[i] + gap;
}
}

function conclusion(ctx, x, y, s, size) {
txt(ctx, s, x, y, { size: size || 18, color: C.yellow, weight: 700, align: 'left' });
}

function drawScalePair(ctx, st, r, G, o) {
o = o || {};
var P = window.VizPhys, cfg = P.vcfg(st.div), k = cfg.k;
var X = G.X, yM0 = G.yM0, yV1 = G.yV1, tk = G.tk;
var big = !!o.big, fs = o.fs || (big ? 13 : 11.5);
var i, n, xp, x, m0, m1, hh, hh2, col, w, al;

m0 = Math.max(0, Math.floor(G.mm0));
m1 = Math.ceil(G.mm1);
for (i = m0; i <= m1; i++) {
xp = X(i);
if (xp < G.x0 - 2 || xp > G.x1 + 2) { continue; }
hh = (i % 10 === 0) ? tk * 1.45 : (i % 5 === 0 ? tk * 1.18 : tk);
al = (i % 5 === 0) ? 1 : 0.68;
seg(ctx, xp, yM0, xp, yM0 + hh, C.white, i % 5 === 0 ? 1.4 : 1, null, al);
var stepLbl = big ? 1 : (fs <= 10 ? 10 : 5);
if (i % stepLbl === 0) {
txt(ctx, String(i), xp, yM0 - 14, { size: fs, color: C.grey });
}
}

seg(ctx, G.x0, G.yBeamTop, G.x1, G.yBeamTop, C.white, 1.5, null, 0.85);
seg(ctx, G.x0, yM0, G.x1, yM0, C.white, 1.5, null, 0.88);

txt(ctx, '主尺', G.x0 - 8, yM0, { size: 11, color: C.grey, align: 'right' });

var lblEvery = big ? 5 : (fs <= 10 ? 10 : (k === 10 ? 1 : 5));
for (n = 0; n <= k; n++) {
x = r.x + n * (k - 1) / k;
xp = X(x);
if (xp < G.x0 - 2 || xp > G.x1 + 2) { continue; }
var isAl = (n === r.idx && o.hiAlign);
var isZero = (n === 0);
col = (isAl || isZero) ? C.yellow : C.white;
hh2 = tk * 0.82;
if (n % 5 === 0) { hh2 = tk * 1.18; }
if (isZero || isAl) { hh2 = tk * 1.62; }
w = (isZero || isAl) ? 2.4 : (n % 5 === 0 ? 1.4 : 1);
seg(ctx, xp, yV1, xp, yV1 - hh2, col, w, null,
(isZero || isAl) ? 1 : (n % 5 === 0 ? 0.92 : 0.68));
if (isAl) { halo(ctx, xp, yV1 - hh2 * 0.55, 9, C.yellow); }
if (n % lblEvery === 0) {
txt(ctx, String(n), xp, yV1 + 15,
{ size: fs, color: (isZero || isAl) ? C.yellow : C.grey, weight: (isZero || isAl) ? 700 : 400 });
}
}
seg(ctx, X(r.x), yV1, X(r.x + cfg.span), yV1, C.white, 1.5, null, 0.88);

txt(ctx, '游标尺', G.x0 - 8, yV1, { size: 11, color: C.grey, align: 'right' });

var pad = big ? 14 : 22;
var sx0 = X(r.x) - pad, sx1 = X(r.x + cfg.span) + pad;
var by0 = yV1 - tk * 1.62 - 15, by1 = yV1 + 26;
ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = C.white;
ctx.fillRect(sx0, by0, sx1 - sx0, by1 - by0); ctx.restore();
box(ctx, sx0, by0, sx1 - sx0, by1 - by0, { stroke: C.white, lw: 1.4 });
}

function drawCaliperMarks(ctx, st, r, G) {
var X = G.X;
var yTop = Math.max(14, G.yM0 - 26), yBot = G.yV1 + 24;

seg(ctx, X(r.x), yTop, X(r.x), yBot, C.yellow, 1.4, [7, 5], 0.75);
txt(ctx, '游标 0 线', X(r.x), yTop - 11, { size: G.tk < 16 ? 10 : 11.5, color: C.yellow, weight: 600 });

if (st.flags && st.flags.hiAlign) {
seg(ctx, X(r.mLine), G.yM0 + 2, X(r.mLine), G.yV1 - 2, C.yellow, 1.6, [3, 3], 0.9);
if (G.showAlignLabel) {
txt(ctx, '对齐', X(r.mLine), G.yV1 + 32, { size: 11, color: C.yellow, weight: 600 });
}
}
}

function drawOffsetRibbon(ctx, st, r, G) {
var P = window.VizPhys, cfg = P.vcfg(st.div), k = cfg.k;
var X = G.X, pxmm = G.pxmm, yb = G.yRib;
var frac = r.x - r.mainMM, n, xp, off, x2;
var i;
for (n = 0; n <= k; n++) {
xp = X(r.x + n * (k - 1) / k);
if (xp < G.x0 - 2 || xp > G.x1 + 2) { continue; }
off = frac - n / k;
if (Math.abs(off) > 1.02) { continue; }
x2 = X(r.mainMM + n);
seg(ctx, xp, yb - 9, xp, yb, C.grey, 1, null, 0.3);
if (Math.abs(off) * pxmm < 1.0) {
dot(ctx, xp, yb, 4, C.yellow);
seg(ctx, xp - 12, yb, xp + 12, yb, C.yellow, 2.4);
} else {
seg(ctx, xp, yb, x2, yb, C.grey, 1.4, null, 0.5);
dot(ctx, x2, yb, 2, C.grey, 0.5);
}
}
seg(ctx, G.x0, yb, G.x1, yb, C.grey, 1, [7, 5], 0.22);
txt(ctx, '对齐残差（短线越短越接近对齐）', G.x0 + 2, yb + 15, { size: 11, color: C.grey, align: 'left' });

if (Math.abs(r.residual) < 1e-6) {
var xa = X(r.mLine);
seg(ctx, xa, yb + 4, xa, yb + 20, C.yellow, 1.6);
txt(ctx, '残差 = 0', xa, yb + 29, { size: 11.5, color: C.yellow, weight: 600 });
}
}

function drawCaliperBody(ctx, st, r, G) {
var X = G.X, yV1 = G.yV1, yJ = G.yJaw, hj = G.jawH;
var xFix = X(0), xMov = X(r.x);

ctx.save();
ctx.strokeStyle = C.white; ctx.lineWidth = 1.6;
ctx.beginPath();
ctx.moveTo(xFix, yV1 + 16); ctx.lineTo(xFix, yJ + hj);
ctx.lineTo(xFix + 15, yJ + hj); ctx.lineTo(xFix + 15, yJ + hj - hj * 0.38);
ctx.lineTo(xFix + 3, yJ + hj - hj * 0.38); ctx.lineTo(xFix + 3, yJ);
ctx.stroke();
ctx.restore();

ctx.save();
ctx.strokeStyle = C.yellow; ctx.lineWidth = 1.6;
ctx.beginPath();
ctx.moveTo(xMov, yV1 + 16); ctx.lineTo(xMov, yJ + hj);
ctx.lineTo(xMov - 15, yJ + hj); ctx.lineTo(xMov - 15, yJ + hj - hj * 0.38);
ctx.lineTo(xMov - 3, yJ + hj - hj * 0.38); ctx.lineTo(xMov - 3, yJ);
ctx.stroke();
ctx.restore();

if (st.flags && st.flags.object) {
var ox0 = xFix + 15, ox1 = xMov - 15;
if (ox1 > ox0 + 4) {
ctx.save();
ctx.globalAlpha = 0.26; ctx.fillStyle = C.grey;
ctx.fillRect(ox0, yJ + hj - hj * 0.34, ox1 - ox0, hj * 0.3);
ctx.restore();
box(ctx, ox0, yJ + hj - hj * 0.34, ox1 - ox0, hj * 0.3, { stroke: C.white, lw: 1.2 });
}
}

if (st.flags && st.flags.dimJaw && xMov - xFix > 60) {
var ym = yJ + hj + 20;
seg(ctx, xFix, ym, xMov, ym, C.yellow, 1.4, null, 0.9);
seg(ctx, xFix, ym - 5, xFix, ym + 5, C.yellow, 1.4);
seg(ctx, xMov, ym - 5, xMov, ym + 5, C.yellow, 1.4);
txt(ctx, '两爪间距 = 游标 0 线位置 = ' + r.total.toFixed(G.dec) + ' mm',
(xFix + xMov) / 2, ym + 17, { size: 11.5, color: C.yellow });
}
}

function drawCaliper(ctx, W, H, st) {
var P = window.VizPhys, cfg = P.vcfg(st.div), span = cfg.span;
var r = P.vernier(st.x, st.div);

var viewMM = P.CAL_XMAX + span + 4;
var pxmm = (W - 130) / viewMM;
var drawW = viewMM * pxmm;
var mL = Math.max(20, (W - drawW) / 2);
var mR = mL;
var X = function (mm) { return mL + mm * pxmm; };

var compact = (H < 470) || (W < 560);
var hasRib = !!(st.flags && st.flags.ribbon);
if (compact) {
drawCaliperCompact(ctx, st, r, W, H, mL, mR, X, pxmm, viewMM, cfg);
return;
}
var zH = clamp(H * 0.30, 124, 350);
var zTop = H - 54 - zH;
var yTop = 62;
var avail = zTop - 30 - yTop;

var ribH = hasRib ? clamp(avail * 0.16, 34, 62) : 0;
var tk = clamp((avail - ribH) * 0.20, 16, 74);
var yBeamTop = yTop + 16;
var yM0 = yBeamTop + tk * 1.45 + 4;
var yV1 = yM0 + tk * 1.45 + tk * 1.62 + 6;
var yJaw = yV1 + 36;
var jawBotMax = zTop - 8 - ribH;
var jawH = clamp(jawBotMax - yJaw, 34, 200);

var G = {
X: X, pxmm: pxmm, x0: mL, x1: W - mR, mm0: 0, mm1: viewMM, dec: cfg.dec,
yM0: yM0, yV1: yV1, yBeamTop: yBeamTop, tk: tk,
yJaw: yJaw, jawH: jawH,
yRib: yJaw + jawH + ribH * 0.55
};

head(ctx, W, '游标卡尺 · ' + cfg.k + ' 分度',
'精度 ' + cfg.precision.toFixed(2) + ' mm　·　游标 ' + cfg.k + ' 格 = 主尺 ' + span + ' mm');

drawCaliperBody(ctx, st, r, G);
drawScalePair(ctx, st, r, G, { hiAlign: !!(st.flags && st.flags.hiAlign) });
drawCaliperMarks(ctx, st, r, G);
if (hasRib) { drawOffsetRibbon(ctx, st, r, G); }

drawZoomStrip(ctx, st, r, W, H, zTop, zH, mL, mR, false);

legend(ctx, W, H - 20, [
{ t: '主尺读数 ' + r.mainMM + ' mm', c: C.blue },
{ t: '第 ' + r.idx + ' 条对齐 × ' + cfg.precision + ' mm', c: C.red },
{ t: '总读数 ' + P.fmtCaliper(r) + ' mm', c: C.yellow }
]);
}

function drawCaliperCompact(ctx, st, r, W, H, mL, mR, X, pxmm, viewMM, cfg) {
var P = window.VizPhys, k = cfg.k;
var yTop = 40;
var avail = H - yTop - 16;
var tk = clamp(avail * 0.16, 11, 26);
var yBeamTop = yTop + 12;
var yM0 = yBeamTop + tk * 1.45 + 3;
var yV1 = yM0 + tk * 1.45 + tk * 1.62 + 4;
var yJaw = yV1 + 24;
var jawH = clamp(H - 18 - yJaw, 26, 90);

var G = {
X: X, pxmm: pxmm, x0: mL, x1: W - mR, mm0: 0, mm1: viewMM, dec: cfg.dec,
yM0: yM0, yV1: yV1, yBeamTop: yBeamTop, tk: tk,
yJaw: yJaw, jawH: jawH, yRib: yJaw + jawH
};
drawCaliperBody(ctx, st, r, G);
drawScalePair(ctx, st, r, G, { hiAlign: !!(st.flags && st.flags.hiAlign), fs: 10 });
drawCaliperMarks(ctx, st, r, G);
legend(ctx, W, H - 12, [
{ t: '主尺 ' + r.mainMM, c: C.blue },
{ t: '第 ' + r.idx + ' 条 ×' + cfg.precision, c: C.red },
{ t: '读数 ' + P.fmtCaliper(r), c: C.yellow }
]);
}

function drawZoomStrip(ctx, st, r, W, H, yTop, h, mL, mR, showRib) {
var P = window.VizPhys, cfg = P.vcfg(st.div);
var boxW = W - mL - mR;
var span = cfg.span;
var winFull = span + 3.2;
var winMM = winFull / Math.max(1, st.zoom);
var cxc = r.x - 0.6 + span / 2;
var mm0 = cxc - winMM / 2, mm1 = cxc + winMM / 2;
if (mm0 < -0.8) { mm0 = -0.8; mm1 = mm0 + winMM; }
if (mm1 > P.CAL_XMAX + span + 0.8) { mm1 = P.CAL_XMAX + span + 0.8; mm0 = mm1 - winMM; }
var pxmm = boxW / winMM;
var X = function (mm) { return mL + (mm - mm0) * pxmm; };

box(ctx, mL, yTop, boxW, h, { stroke: C.grey, lw: 1.2, dash: [7, 5] });
txt(ctx, '放大 ×' + st.zoom.toFixed(1), mL + 10, yTop + 15, { size: 11.5, color: C.grey, align: 'left' });
txt(ctx, '窗口 ' + mm0.toFixed(1) + ' ~ ' + mm1.toFixed(1) + ' mm　|　1 mm = ' +
pxmm.toFixed(0) + ' px', mL + boxW - 10, yTop + 15, { size: 11.5, color: C.grey, align: 'right' });

var tk = clamp(h * 0.155, 18, 56);
var yBeamTop = yTop + 34;
var yM0 = yBeamTop + tk * 1.45 + 4;
var yV1 = yM0 + tk * 1.45 + tk * 1.62 + 6;
var G = {
X: X, pxmm: pxmm, x0: mL + 1, x1: mL + boxW - 1, mm0: mm0, mm1: mm1,
yM0: yM0, yV1: yV1, yBeamTop: yBeamTop, tk: tk
};
ctx.save();
ctx.beginPath(); ctx.rect(mL + 1, yTop + 1, boxW - 2, h - 2); ctx.clip();
G.showAlignLabel = true;
drawScalePair(ctx, st, r, G, { hiAlign: !!(st.flags && st.flags.hiAlign), big: true, fs: 12.5 });
drawCaliperMarks(ctx, st, r, G);
if (showRib) {
var gr = {
X: X, pxmm: pxmm, x0: mL + 1, x1: mL + boxW - 1, mm0: mm0, mm1: mm1,
yRib: Math.min(yTop + h - 34, G.yV1 + 46)
};
drawOffsetRibbon(ctx, st, r, gr);
}
ctx.restore();

if (st.flags && st.flags.hiAlign) {
txt(ctx, '第 ' + r.idx + ' 条：残差 ' + r.residual.toFixed(4) + ' mm　（残差 = 0 即完全对齐）',
mL + boxW / 2, Math.min(yTop + h - 13, yV1 + 58), { size: 12, color: C.yellow, weight: 600 });
}
}

function drawMicrometer(ctx, W, H, st) {
var P = window.VizPhys;
var r = P.micro(st.x);

var gapL = 104;
var sleeveW = clamp(W * 0.50, 300, 820);
var thW = clamp(W * 0.30, 210, 520);
var mL = Math.max(gapL + 26, (W - sleeveW / 2 - thW + 20) / 2);
var mR = 40;
var sl0 = mL, sl1 = sl0 + sleeveW;
var pxmm = sleeveW / P.MIC_MAX;
var X = function (mm) { return sl0 + mm * pxmm; };

var compact = (H < 470) || (W < 560);
var stripH = compact ? 0 : clamp(H * 0.31, 118, 340);
var stripTop = H - 50 - stripH;
var instTop = compact ? 36 : 54, instBot = stripTop - (compact ? 14 : 54);
var yD = instTop + (instBot - instTop) * 0.50;
var sleeveHH = clamp((instBot - instTop) * (compact ? 0.42 : 0.34), compact ? 30 : 44, compact ? 60 : 104);
var thimbleHH = clamp((instBot - instTop) * (compact ? 0.62 : 0.50), compact ? 46 : 74, compact ? 96 : 172);

if (!compact) {
head(ctx, W, '螺旋测微器 · 螺距 ' + P.MIC_PITCH + ' mm',
'固定刻度 0.5 mm 一格　·　可动刻度 50 格，每格 0.01 mm　·　读到 0.001 mm');
} else {
txt(ctx, '螺旋测微器 · 螺距 0.5 mm', 16, 18, { size: 13, color: C.white, weight: 600, align: 'left' });
}

var jawBot = yD + thimbleHH + 22;
ctx.save();
ctx.strokeStyle = C.white; ctx.lineWidth = 6; ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(sl0 - 20, yD - sleeveHH - 10);
ctx.lineTo(sl0 - 20, jawBot - 56);
ctx.quadraticCurveTo(sl0 - 20, jawBot, sl0 + 58, jawBot);
ctx.stroke();
ctx.restore();
box(ctx, sl0 - 13, yD - sleeveHH - 4, 14, sleeveHH * 2 + 8, { stroke: C.white, lw: 1.8 });

var t0 = X(r.x);
var t1 = t0 + thW;
box(ctx, sl0, yD - sleeveHH, Math.max(4, t0 - sl0), sleeveHH * 2, { stroke: C.grey, lw: 1.2 });

var m, xp, exposed, isLast, xh, isLastH;
for (m = 0; m <= P.MIC_MAX; m++) {
xp = X(m);
if (m > r.x + 1e-9) { break; }
isLast = (m + 1 > r.x + 1e-9);
seg(ctx, xp, yD - sleeveHH * 0.62, xp, yD - 5,
isLast ? C.blue : C.white, isLast ? 2.4 : 1.4, null, 1);
txt(ctx, String(m), xp, yD - sleeveHH * 0.62 - 15,
{ size: 12.5, color: isLast ? C.blue : C.grey, weight: isLast ? 700 : 400 });
if (m < P.MIC_MAX) {
xh = X(m + 0.5);
if (m + 0.5 <= r.x + 1e-9) {
isLastH = (m + 1.0 > r.x + 1e-9);
seg(ctx, xh, yD + 5, xh, yD + sleeveHH * 0.48,
isLastH ? C.blue : C.white, isLastH ? 2.4 : 1.4, null, 1);
}
}
}

var lx = sl0 - 30;
txt(ctx, '毫米线', lx, yD - sleeveHH * 0.62 - 10, { size: 10.5, color: C.grey, align: 'right' });
txt(ctx, '半毫米线', lx, yD + sleeveHH * 0.48 + 11, { size: 10.5, color: C.grey, align: 'right' });
txt(ctx, '基准线', sl0 + 5, yD + 13, { size: 10.5, color: C.grey, align: 'left' });

box(ctx, t0, yD - thimbleHH, thW, thimbleHH * 2, { fill: C.bg });
ctx.save(); ctx.globalAlpha = 0.045; ctx.fillStyle = C.white;
ctx.fillRect(t0, yD - thimbleHH, thW, thimbleHH * 2); ctx.restore();
box(ctx, t0, yD - thimbleHH, thW, thimbleHH * 2, { stroke: C.white, lw: 1.4 });

var kx = t1 - 46, jj, yy;
ctx.save(); ctx.globalAlpha = 0.38; ctx.strokeStyle = C.grey; ctx.lineWidth = 1;
for (jj = -20; jj <= 20; jj++) {
yy = yD + jj * 12;
if (yy < yD - thimbleHH + 8 || yy > yD + thimbleHH - 8) { continue; }
ctx.beginPath(); ctx.moveTo(kx, yy); ctx.lineTo(t1 - 8, yy); ctx.stroke();
}
ctx.restore();

var gap = clamp(thimbleHH * 2 / 24, 6, 15);
var dc = r.div + r.est / 10;
var d, yd, vis, isCur, col2, len;
for (d = 0; d < P.MIC_DIV; d++) {
yd = yD - (d - dc) * gap;
if (yd < yD - thimbleHH + 6 || yd > yD + thimbleHH - 6) { continue; }
vis = Math.abs(d - dc) < 0.5;
isCur = (d === r.div);
col2 = vis ? C.yellow : (isCur ? C.red : C.white);
len = (d % 5 === 0) ? 22 : 13;
seg(ctx, t0 + 4, yd, t0 + 4 + len, yd, col2, vis ? 2.4 : (isCur ? 1.8 : 1.1),
null, (d % 5 === 0 || vis) ? 1 : 0.60);
if (d % 5 === 0) {
txt(ctx, String(d), t0 + len + 12, yd, { size: 11.5, color: vis ? C.yellow : C.grey, align: 'left' });
}
}
if (r.est > 0) {
halo(ctx, t0 + 4, yD, 9, C.gold);
seg(ctx, t0 - 11, yD, t0 + 4, yD, C.gold, 1.4, [3, 3]);
}

seg(ctx, sl0, yD, Math.min(t1 - 12, t0 + 150), yD, C.white, 1.8, null, 0.95);

seg(ctx, t0, yD - thimbleHH - 14, t0, yD + thimbleHH + 10, C.yellow, 2.4);
txt(ctx, '读数边', t0, yD - thimbleHH - 27, { size: 11.5, color: C.yellow, weight: 600 });

if (st.flags && st.flags.pitch) {
var yb2 = jawBot + 12;
var xa = X(r.fixedMM), xb = X(r.fixedMM + P.MIC_PITCH);
seg(ctx, xa, yb2, xb, yb2, C.yellow, 1.6);
seg(ctx, xa, yb2 - 6, xa, yb2 + 6, C.yellow, 1.6);
seg(ctx, xb, yb2 - 6, xb, yb2 + 6, C.yellow, 1.6);
txt(ctx, '转 1 圈 → 前进 0.5 mm = 50 格 × 0.01 mm',

for (m = Math.max(0, Math.floor(mm0)); m <= Math.min(MIC_MM, Math.ceil(mm1)); m++) {

{
act: AM, title: '游标卡尺读数五步法 —— 一步都不能跳',
hint: '拖 <b>「游标零线位置」</b>换一个位置，右边五步法会<b>跟着高亮</b>当前该做哪一步',
note: '这是标准流程，抄自教材与实验册：<br>' +
'<b>① 识别分度类型</b>：确认是 10 / 20 / 50 分度，不同分度对应不同精度（本次实验按精度显示小数位数）。<br>' +
'<b>② 读取主尺读数</b>：观察游标尺"0"刻度线在主尺上的位置，读取主尺<b>整毫米数</b>（不估读小数）。<br>' +

'<b>④ 计算游标读数</b>：对齐线的序号 × 游标卡尺精度（10 分度 0.1 mm，20 分度 0.05 mm，50 分度 0.02 mm）。<br>' +
'<b>⑤ 合计最终读数</b>：主尺读数 + 游标尺读数 = 精确测量值（单位：毫米）。',
formula: '读数 = 主尺读数 + 游标尺读数 = L + n × 精度',
allow: { x: true, div: true, zoom: true, drag: true },
rng: { x: [0, 21, 0.02], zoom: [1, 5, 0.5] },
inst: 'caliper', div: 20,
flags: { object: true, hiAlign: true, steps: true },
init: function (st) { st.real = false; st.div = 20; st.x = 6.55; st.zoom = 2.5; }
},
{
act: AM, title: '螺旋测微器读数三步法 —— 半毫米线是命门',
hint: '拖 <b>「微分筒位置」</b>，右边三步法会高亮当前该做哪一步；注意第 ① 步专门盯半毫米线',
note: '抄自实验册的流程：<br>' +
'<b>① 看半毫米线露没露</b>：固定刻度上"上面是毫米线、下面是半毫米线"，半毫米线露出来了就要多算 0.5 mm —— ' +
'这是最常见的错。<br>' +
'<b>② 读固定刻度 + 可动刻度格数</b>：固定刻度读到露出的最后一条线；基准线对着可动刻度第几格，就是几个 0.01 mm。<br>' +
'<b>③ 估读最后一位</b>：基准线落在两格之间时，估出它占了几成，写成 0.001 mm 那一位。',
formula: '读数 = 固定刻度 + 格数 × 0.01 + 估读 × 0.001 mm',
allow: { x: true, zoom: true, drag: true },
rng: { x: [0, 12, 0.001], zoom: [1, 5, 0.5] },
inst: 'micrometer',
flags: { pitch: true, steps: true },
init: function (st) { st.real = false; st.x = 5.96; st.zoom = 2; }
},

function apply(st, i) {
i = Math.max(0, Math.min(STEPS.length - 1, i));
var d = STEPS[i], k, b = base();
for (k in b) { if (Object.prototype.hasOwnProperty.call(b, k)) { st[k] = b[k]; } }
st.flags = { object: true, dimJaw: false, ribbon: false, hiAlign: false,
pitch: false, zero: false };
if (d.init) { d.init(st); }
st.step = i;
st.act = d.act; st.title = d.title;
st.hint = d.hint || ''; st.note = d.note || '';
st.formula = d.formula || '';
st.allow = d.allow || {};
st.rng = d.rng || {};
st.inst = d.inst || 'caliper';
st.real = !!d.real;
st.objectMM = (d.real ? st.objectMM : null);
st.div = d.div || st.div || 10;
var f = d.flags || {};
for (k in f) { if (Object.prototype.hasOwnProperty.call(f, k)) { st.flags[k] = f[k]; } }
return st;
}

/* ===================== 步骤机 ===================== */
function goto(i) {
S.apply(st, i);
quizGot = null; quizMsg = null; quizShown = false;
var inp = document.getElementById('quizIn');
if (inp) { inp.value = ''; }
if (st.quiz && st.quiz.on) { st.x = (st.inst === 'micrometer') ? P.newMicroS(st.quiz.seed) : P.newCaliperS(st.div, st.quiz.seed); }
draw();
syncSliders();
}
function next() { if (st.step < S.STEPS.length - 1) { goto(st.step + 1); } }
function prev() { if (st.step > 0) { goto(st.step - 1); } }

(function () {

function start(mode) {
return function (e) {
kn = { mode: mode, y: e.clientY };
e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
};
}
function move(e) {

var dy = kn.y - e.clientY;
kn.y = e.clientY;

st.x = clampX(st.x + dy * step * 0.5);

function end() { kn = null; }

for (var i = 0; i < bs.length; i++) {
bs[i].addEventListener('pointerdown', start(bs[i].dataset.knob));
bs[i].addEventListener('pointermove', move);
bs[i].addEventListener('pointerup', end);
bs[i].addEventListener('pointercancel', end);
}
})();

document.addEventListener('keydown', function (e) {
if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) { return; }
if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
else if (e.key === 'Home') { goto(0); }

/* ===================== 自检钩子 ===================== */
function hash() {
/* 注意：绝不调 fitCanvas()，复用 draw() 存下的尺寸（踩坑 8） */
if (!W || !H) { return 'empty'; }
var d = ctx.getImageData(0, 0, Math.min(W, cv.width), Math.min(H, cv.height)).data;
var h = 2166136261 >>> 0, i, step = 97;
for (i = 0; i < d.length; i += step * 4) {
h ^= d[i]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 1]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 2]; h = Math.imul(h, 16777619) >>> 0;
}
return (h >>> 0).toString(16);
}

function checkAllowConsistency() {
/* 验收第 5 条：hint 说能拖的，allow 里必须有 */
var bad = [], i, d, hint, allow;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i]; hint = d.hint || ''; allow = d.allow || {};
if (/游标零线位置|微分筒位置/.test(hint) && !allow.x) { bad.push('step' + (i + 1) + ': hint 提到位置滑杆，allow.x 缺失'); }
if (/放大|放大条/.test(hint) && !allow.zoom && !allow.drag) { bad.push('step' + (i + 1) + ': hint 提到放大，allow.zoom/drag 缺失'); }
if (/分度/.test(hint) && /点/.test(hint) && /10 \/ 20 \/ 50/.test(hint) && !allow.div) { bad.push('step' + (i + 1) + ': hint 提到分度切换，allow.div 缺失'); }
var negated = /不用拖|不需要拖|无需拖|不用再拖/.test(hint);
if (/拖|拖动/.test(hint) && !negated && !allow.drag && !allow.x) { bad.push('step' + (i + 1) + ': hint 说了拖动，allow 无 drag/x'); }
if (/随机出题|核对/.test(hint) && !allow.quiz) { bad.push('step' + (i + 1) + ': hint 提到出题/核对，allow.quiz 缺失'); }
}
return { ok: bad.length === 0, bad: bad };
}

window.__viz = {
selfTest: function () {
var p = P.runSelfTest();
var c = checkAllowConsistency();
var fails = p.fails.slice();
var n = p.nfail + (c.ok ? 0 : c.bad.length);
if (!c.ok) { fails = fails.concat(c.bad); }
return { pass: n === 0, cases: p.cases, nfail: n, fails: fails.slice(0, 12) };
},
hash: hash,
goto: goto, next: next, prev: prev,
state: function () { return st; },
setX: function (v) { st.x = v; draw(); },
answer: answerText,
checkAllow: checkAllowConsistency,
steps: S.STEPS.length,
diag: function () { return { W: W, H: H, cw: cv.width, ch: cv.height, inst: st.inst, step: st.step }; }
};

/* ===================== 启动 ===================== */
buildToc();
bind();
goto(0);
window.addEventListener('load', function () { fitCanvas(); R.draw(ctx, W, H, st); });
})();

</script>
