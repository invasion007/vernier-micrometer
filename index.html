<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游标卡尺与螺旋测微器 · 读数练习</title>
<style>
  /* ===================================================================
     UI 照参考站（游标卡尺 12 号页 / 螺旋测微器 33 号页）的视觉语言：
       浅色渐变背景 #f5f7fa→#e4edf9 · 白色卡片 圆角 15px + 柔和阴影
       主色 #3498db（按钮/滑块）· 读数色 #297fb8 · 强调红 #c0392b
       说明区 #eef5fd 底 + #1565c0 标题 · 分度标签 #DCDCDC 底
     只把版式从"单列长页"改成"左右分栏"，其余视觉语言不变。
     =================================================================== */
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,'Microsoft YaHei','PingFang SC',sans-serif;
    background:linear-gradient(135deg,#f5f7fa 0%,#e4edf9 100%);
    color:#333; overflow:hidden;
  }
  .app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100vh;padding:10px 14px 12px;gap:8px;}

  /* —— 顶栏（参考站 header 卡片） —— */
  header{
    background:rgba(255,255,255,0.95); border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    padding:8px 18px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:1.05rem;color:#2c3e50;font-weight:600;}
  .act{font-size:.78rem;color:#3498db;background:#eef5fd;border:1px solid #d7e5f7;
    border-radius:20px;padding:2px 10px;white-space:nowrap;}
  .steptitle{font-size:.92rem;color:#37474f;font-weight:600;}
  .stepsn{margin-left:auto;font-size:.82rem;color:#6b7780;font-variant-numeric:tabular-nums;}

  /* —— 顶部步骤导航 —— */
  .topnav{display:flex;align-items:center;gap:5px;padding:6px 12px;overflow-x:auto;overflow-y:hidden;
    background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .topnav .grouplab{flex:0 0 auto;font-size:.7rem;letter-spacing:.4px;color:#90a4ae;font-weight:600;white-space:nowrap;}
  .topnav .sep{flex:0 0 auto;width:1px;height:14px;background:#e0e7ef;margin:0 5px;}
  .topnav a{flex:0 0 auto;min-width:26px;height:22px;padding:0 7px;display:inline-flex;align-items:center;justify-content:center;
    font-size:.76rem;font-variant-numeric:tabular-nums;color:#546e7a;background:#f8fafd;
    border:1px solid #e0e7ef;border-radius:6px;cursor:pointer;text-decoration:none;}
  .topnav a:hover{border-color:#3498db;background:#f1f7ff;}
  .topnav a.on{background:#3498db;border-color:#3498db;color:#fff;font-weight:700;}

  /* —— 主舞台 —— */
  .stage{display:grid;grid-template-columns:1fr 296px;gap:8px;min-height:0;}

  .card{background:#fff;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,0.08);overflow:hidden;}
  .canvaswrap{position:relative;min-width:0;min-height:0;padding:6px;background:#fff;border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;
    background:linear-gradient(to bottom,#f0f5fc,#ffffff);border-radius:8px;
    box-shadow:inset 0 0 10px rgba(0,0,0,0.08);}

  /* —— 右栏（参考站 reading-area / instructions 风格） —— */
  aside{background:#fff;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,0.08);
    padding:12px 14px;overflow-y:auto;min-height:0;}
  aside h3{font-size:.78rem;color:#90a4ae;margin:12px 0 6px;font-weight:600;letter-spacing:.4px;}
  aside h3:first-child{margin-top:0;}
  .rd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:5px 0;
    font-size:.8rem;color:#546e7a;border-bottom:1px dashed #e0e7ef;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:.92rem;color:#297fb8;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
    font-family:'Courier New',monospace;}
  .rd b.red{color:#c0392b;} .rd b.grey{color:#78909c;}

  /* 读数条：参考站 .reading-part 灰底 + .reading-value 大字 */
  .total{margin-top:10px;padding:10px 12px;background:#DCDCDC;border:1px solid #e9f0f9;
    border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,0.04);text-align:center;}
  .total .lab{font-size:.76rem;color:#546e7a;display:block;margin-bottom:2px;}
  .total b{font-size:1.7rem;color:#297fb8;font-weight:700;font-family:'Courier New',monospace;
    font-variant-numeric:tabular-nums;}

  /* 公式 / 说明：参考站 instructions 蓝底 */
  .formula{font-size:.84rem;color:#1565c0;background:#eef5fd;border:1px solid #d7e5f7;
    border-radius:8px;padding:9px 11px;line-height:1.6;word-break:break-word;}
  .note{font-size:.8rem;color:#37474f;line-height:1.68;}
  .note b{color:#e74c3c;font-weight:600;}

  /* 练习区 */
  .quiz input{width:100%;font-family:'Courier New',monospace;font-size:1.05rem;
    font-variant-numeric:tabular-nums;color:#297fb8;background:#fff;
    border:1px solid #dde2e9;border-radius:8px;padding:7px 10px;outline:none;}
  .quiz input:focus{border-color:#3498db;}
  .qdec{font-size:.72rem;color:#90a4ae;margin-top:4px;}
  .qmsg{font-size:.78rem;margin-top:6px;line-height:1.5;color:#546e7a;}
  .qmsg.ok{color:#27ae60;} .qmsg.bad{color:#c0392b;}
  .qans{font-size:.86rem;color:#297fb8;margin-top:5px;font-variant-numeric:tabular-nums;
    font-family:'Courier New',monospace;}

  /* —— 按钮（参考站 .btn / select 风格） —— */
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .grp .lab{font-size:.76rem;color:#90a4ae;}
  button{font-family:inherit;font-size:.8rem;color:#fff;font-weight:500;
    background:#3498db;border:none;border-radius:8px;padding:5px 14px;cursor:pointer;
    white-space:nowrap;transition:all .2s ease;}
  button:hover{background:#2980b9;transform:translateY(-1px);box-shadow:0 4px 8px rgba(52,152,219,0.25);}
  button:active{transform:translateY(0);}
  button.ghost{background:#fff;color:#546e7a;border:1px solid #dde2e9;}
  button.ghost:hover{background:#f1f7ff;border-color:#3498db;box-shadow:none;}
  button.on{background:#2980b9;box-shadow:0 0 0 2px rgba(52,152,219,0.3);}
  button.warn{background:#e67e22;}
  button.warn:hover{background:#d35400;}

  /* —— 提示条（参考站 .hint 胶囊） —— */
  .hint{padding:7px 16px;font-size:.82rem;color:#7e57c2;background:rgba(240,248,255,0.9);
    border:1px solid #dde5f0;border-radius:15px;min-height:32px;}
  .hint b{color:#3498db;font-weight:600;}

  /* —— 底栏 —— */
  footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px;
    padding:8px 14px;background:#fff;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.06);}
  .bar{position:relative;flex:1 1 120px;min-width:80px;height:8px;background:#e0e7ef;border-radius:4px;}
  .bar i{display:block;height:100%;width:0;background:#3498db;border-radius:4px;transition:width .2s;}
  .slider{display:flex;align-items:center;gap:6px;font-size:.8rem;color:#546e7a;}
  .slider input[type=range]{width:130px;height:8px;background:#e0e7ef;border-radius:4px;
    outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;}
  .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
    border-radius:50%;background:#3498db;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,0.2);}
  .slider input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;
    background:#3498db;cursor:pointer;}
  .slider b{color:#297fb8;font-variant-numeric:tabular-nums;min-width:62px;text-align:right;
    font-family:'Courier New',monospace;}
  .hidden{display:none !important;}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr;grid-template-rows:1fr auto;}
    aside{max-height:26vh;border-radius:12px;}
    .app{padding:6px 8px 8px;gap:6px;}
    header h1{font-size:.9rem;} .steptitle{font-size:.8rem;}
    .slider input[type=range]{width:86px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>游标卡尺 &amp; 螺旋测微器</h1>
    <span class="act" id="actTag">实物测量</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 24</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3 id="rdHead1">主尺读数</h3>
      <div id="rdGroup1"></div>
      <h3 id="rdHead2">游标尺读数</h3>
      <div id="rdGroup2"></div>
      <div class="total"><span class="lab">最终读数</span><b id="rdTotal">—</b></div>

      <div id="quizPane" class="quiz hidden">
        <h3>你的读数（mm）</h3>
        <input id="quizIn" type="text" inputmode="decimal" autocomplete="off" placeholder="例 7.30">
        <div class="qdec" id="quizDec"></div>
        <div class="grp" style="margin-top:7px">
          <button id="btnQuizCheck">核对</button>
          <button id="btnQuizAns" class="ghost">显示答案</button>
        </div>
        <div class="qmsg" id="quizMsg"></div>
        <div class="qans hidden" id="quizAns"></div>
      </div>

      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>说明</h3>
      <div class="note" id="rdNote"></div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev" class="ghost">◀ 上一步</button>
    <button id="btnNext">下一步 ▶</button>
    <button id="btnReset" class="ghost">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>

    <div class="slider" id="wrap_x"><span id="lbXLab">游标零线位置</span>
      <input type="range" id="rgX" min="0" max="21" step="0.02" value="7.3"><b id="lbX">7.30 mm</b></div>
    <div class="slider" id="wrap_zoom"><span>放大倍数</span>
      <input type="range" id="rgZoom" min="1" max="4" step="0.5" value="1"><b id="lbZoom">×1.0</b></div>

    <div class="grp" id="wrapDivBtn"><span class="lab">分度</span>
      <button class="ghost" data-div="10">10 分度</button>
      <button class="ghost" data-div="20">20 分度</button>
      <button class="ghost" data-div="50">50 分度</button>
      <span class="lab" id="lbDiv">10 分度</span>
    </div>

    <div class="grp" id="wrapFine"><span class="lab">微调</span>
      <button class="ghost" data-d="-0.01">−0.01</button>
      <button class="ghost" data-d="0.01">+0.01</button>
      <button class="ghost" data-d="-0.001">−0.001</button>
      <button class="ghost" data-d="0.001">+0.001</button>
    </div>

    <div class="grp" id="wrapZoomBtn"><span class="lab">缩放</span>
      <button class="ghost" data-z="in">放大 +</button>
      <button class="ghost" data-z="out">缩小 −</button>
      <button class="ghost" data-z="reset">重置</button>
    </div>

    <div class="grp" id="wrapKnob"><span class="lab">旋钮</span>
      <button class="ghost" data-knob="coarse">粗调（上/下拖）</button>
      <button class="ghost" data-knob="fine">微调（上/下拖）</button>
    </div>

    <div class="grp" id="wrapQuizBtn">
      <button id="btnQuizNew">随机出题</button>
    </div>
  </footer>
</div>

window.VizPhys = (function () {
'use strict';

var VERNIER = {
10: { k: 10, precision: 0.1,  dec: 1, span: 9  },
20: { k: 20, precision: 0.05, dec: 2, span: 19 },
50: { k: 50, precision: 0.02, dec: 2, span: 49 }
};
var DIVS = [10, 20, 50];
var CAL_XMAX = 21;
var CAL_MM   = 150;

function vcfg(div) { return VERNIER[div] || VERNIER[10]; }

function caliperSpan(div) { return vcfg(div).span + CAL_XMAX; }

function vernier(x, div) {
var c = vcfg(div), k = c.k;
if (!(x >= 0)) { x = 0; }
if (x > CAL_MM) { x = CAL_MM; }
var L = Math.floor(x + 1e-9);
var frac = x - L;
var n = Math.round(frac * k);
if (n >= k) { n = 0; L += 1; }
var vLine = x + n * (k - 1) / k;
var mLine = L + n;
return {
div: div, k: k, precision: c.precision, dec: c.dec, span: c.span,
x: x, mainMM: L, idx: n, vernierMM: n / k, total: L + n / k,
vLine: vLine, mLine: mLine, residual: vLine - mLine
};
}

function fmtCaliper(r) { return r.total.toFixed(r.dec); }

var MIC_MAX   = 12;
var MIC_PITCH = 0.5;
var MIC_DIV   = 50;

function micro(x) {
if (!(x >= 0)) { x = 0; }
if (x > MIC_MAX) { x = MIC_MAX; }
var xm = Math.round(x * 1000);
var half = Math.floor(xm / 500);
var rem  = xm - half * 500;
var div  = Math.floor(rem / 10);
var est  = rem % 10;
return {
x: xm / 1000, xm: xm,
half: half, fixedMM: half * 0.5,
div: div, movableMM: div * 0.01,
est: est, estMM: est * 0.001,
total: xm / 1000,
phase: rem / 500,
tight: rem < 50
};
}

function fmtMicro(r) { return r.total.toFixed(3); }

function mulberry32(a) {
return function () {
a |= 0; a = a + 0x6D2B79F5 | 0;
var t = Math.imul(a ^ a >>> 15, 1 | a);
t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
return ((t ^ t >>> 14) >>> 0) / 4294967296;
};
}
function rndInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function rndIntS(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }

function newCaliper(div) {
var c = vcfg(div);
var L = rndInt(1, CAL_XMAX - 1);
var n = rndInt(1, c.k - 1);
return L + n / c.k;
}

function newMicro() {
return rndInt(100, MIC_MAX * 1000 - 100) / 1000;
}

function newObject(inst, seed) {
var rng = mulberry32((seed >>> 0) || 1);
if (inst === 'micrometer') {
return Math.round((0.3 + rng() * 1.3) * 1000) / 1000;
}
return Math.round((5 + rng() * 35) * 100) / 100;
}

function newObjectCaliper(div, seed) {
var c = vcfg(div), rng = mulberry32((seed >>> 0) || 1);
var whole = 5 + Math.floor(rng() * 35);
var n = 1 + Math.floor(rng() * (c.k - 1));
return Math.round((whole + n / c.k) * 100) / 100;
}

function newCaliperS(div, seed) {
var c = vcfg(div), rng = mulberry32(seed >>> 0);
var L = rndIntS(rng, 1, CAL_XMAX - 1);
var n = rndIntS(rng, 1, c.k - 1);
return L + n / c.k;
}
function newMicroS(seed) {
var rng = mulberry32(seed >>> 0);
return rndIntS(rng, 100, MIC_MAX * 1000 - 100) / 1000;
}

function diagnoseCaliper(got, r) {
if (!isFinite(got)) { return { ok: false, kind: 'empty', msg: '还没有填读数' }; }
if (Math.abs(got - r.total) < 1e-6) {
return { ok: true, kind: 'ok', msg: '读数正确' };
}
var gL = Math.floor(got + 1e-9), gFrac = got - gL;
var gN = Math.round(gFrac * r.k);
if (gN >= r.k) { gN = 0; gL += 1; }
if (gL !== r.mainMM) {
return { ok: false, kind: 'main',
msg: '主尺读数错：游标 0 线左边最近的主尺刻度是 ' + r.mainMM +
' mm，你读的是 ' + gL + ' mm' };
}
if (gN !== r.idx) {
return { ok: false, kind: 'vernier',
msg: '游标读数错：与主尺对齐的是第 ' + r.idx + ' 条线，你数成了第 ' + gN + ' 条' };
}
return { ok: false, kind: 'other', msg: '再核对一遍' };
}

function diagnoseMicro(got, r) {
if (!isFinite(got)) { return { ok: false, kind: 'empty', msg: '还没有填读数' }; }
if (Math.abs(got - r.total) < 5e-4) {
return { ok: true, kind: 'ok', msg: '读数正确' };
}
var gm = Math.round(got * 1000);
var gHalf = Math.floor(gm / 500);
var gRem = gm - gHalf * 500;
var gDiv = Math.floor(gRem / 10);
if (gHalf !== r.half) {
return { ok: false, kind: 'fixed',
msg: '固定刻度错：露出的最后一条刻度是 ' + r.fixedMM.toFixed(1) +
' mm，你读的是 ' + (gHalf * 0.5).toFixed(1) + ' mm' +
(Math.abs(gHalf - r.half) === 1 ? '（多半是半毫米线看漏/看多了）' : '') };
}
if (gDiv !== r.div) {
return { ok: false, kind: 'movable',
msg: '可动刻度错：基准线对着第 ' + r.div + ' 格，你读的是第 ' + gDiv + ' 格' };
}
return { ok: false, kind: 'est', msg: '格数对了，只差估读位 —— 再看一眼基准线落在格内的位置' };
}

function runSelfTest() {
var fails = [], cases = 0;
function chk(cond, msg) { cases++; if (!cond) { fails.push(msg); } }

DIVS.forEach(function (div) {
var c = vcfg(div), k = c.k, i, x, r;
for (i = 0; i <= 420; i++) {
x = i * 0.05 + 0.031;
if (x > CAL_XMAX) { break; }
r = vernier(x, div);
chk(Math.abs(r.total - x) <= c.precision / 2 + 1e-9,
'卡尺量化误差超标 div=' + div + ' x=' + x.toFixed(4) + ' got=' + r.total.toFixed(4));

'分解式不符 div=' + div + ' x=' + x.toFixed(4));
chk(r.idx >= 0 && r.idx < k, '对齐序号越界 div=' + div + ' idx=' + r.idx);
chk(r.mainMM >= 0, '主尺读数为负');

var e1 = vernier(10.3, 10);

var e2 = vernier(6.55, 20);
chk(e2.mainMM === 6 && e2.idx === 11 && Math.abs(e2.total - 6.55) < 1e-9,

var e3 = vernier(3.80, 50);
chk(e3.mainMM === 3 && e3.idx === 40 && Math.abs(e3.total - 3.8) < 1e-9,

for (i2 = 0; i2 <= MIC_MAX * 1000; i2 += 7) {

r2 = micro(x2);
chk(Math.abs(r2.fixedMM + r2.movableMM + r2.estMM - r2.total) < 1e-9,
'螺旋分解式不符 x=' + x2);
chk(r2.div >= 0 && r2.div <= 49, '可动刻度越界 x=' + x2 + ' div=' + r2.div);
chk(r2.est >= 0 && r2.est <= 9, '估读越界 x=' + x2 + ' est=' + r2.est);
chk(Math.abs(r2.total - x2) < 1e-9, '往返不符 x=' + x2);
chk(Math.abs(r2.fixedMM + r2.phase * MIC_PITCH - r2.total) < 1e-9,

var m1 = micro(5.960);
chk(m1.half === 11 && m1.fixedMM === 5.5 && m1.div === 46 && m1.est === 0,
'教材例：5.5 + 46×0.01 = 5.960 mm');
var m2 = micro(4.500);
chk(m2.half === 9 && m2.fixedMM === 4.5 && m2.div === 0 && m2.est === 0,
'教材例：4.500 mm（半毫米线刚露）');
var m3 = micro(0.000);
chk(m3.half === 0 && m3.div === 0 && m3.est === 0, '零点：0.000 mm');
var m4 = micro(12);
chk(m4.half === 24 && m4.div === 0, '量程上限：12.000 mm');

var t;
for (t = 0; t < 300; t++) {
var cx = newCaliper(50);
chk(cx >= 0 && cx <= CAL_XMAX, '卡尺出题越界 ' + cx);
var cr = vernier(cx, 50);
chk(Math.abs(cr.total - cx) < 1e-9, '卡尺出题不能完美对齐 ' + cx);

chk(mx >= 0 && mx <= MIC_MAX, '螺旋出题越界 ' + mx);

ctx.strokeStyle = color; ctx.lineWidth = w || 1.4; ctx.lineCap = 'butt';
if (dash) { ctx.setLineDash(dash); }
if (alpha != null) { ctx.globalAlpha = alpha; }
ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
ctx.restore();
}
function rrectPath(ctx, x, y, w, h, r) {
r = Math.min(r, w / 2, h / 2);
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.arcTo(x + w, y, x + w, y + h, r);
ctx.arcTo(x + w, y + h, x, y + h, r);
ctx.arcTo(x, y + h, x, y, r);
ctx.arcTo(x, y, x + w, y, r);
ctx.closePath();
}

function metal(ctx, x, y, w, h, r, hi, mid, lo) {

var g = ctx.createLinearGradient(0, y, 0, y + h);
g.addColorStop(0, '#e0e0e0');
g.addColorStop(0.45, '#ffffff');
g.addColorStop(0.55, '#ffffff');
g.addColorStop(1, '#b0b0b0');
ctx.save();
rrectPath(ctx, x, y, w, h, r);
ctx.fillStyle = g; ctx.fill();
ctx.strokeStyle = C.dLo; ctx.lineWidth = 1;
ctx.stroke();
ctx.restore();
}

function sheen(ctx, x, y, w, alpha) {
ctx.save();
ctx.globalAlpha = alpha == null ? 0.5 : alpha;
ctx.strokeStyle = C.white; ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(x + 2, y + 0.5); ctx.lineTo(x + w - 2, y + 0.5); ctx.stroke();
ctx.restore();
}

function knurl(ctx, x, y, w, h, step, alpha) {
ctx.save();
ctx.globalAlpha = alpha == null ? 0.45 : alpha;
ctx.strokeStyle = C.dLo; ctx.lineWidth = 1;
for (var i = x + step * 0.5; i < x + w; i += step) {
ctx.beginPath(); ctx.moveTo(i, y + 2); ctx.lineTo(i, y + h - 2); ctx.stroke();
}
ctx.globalAlpha = (alpha == null ? 0.45 : alpha) * 0.55;
ctx.strokeStyle = C.white;
for (var j = x + step * 0.5 + 1; j < x + w; j += step) {
ctx.beginPath(); ctx.moveTo(j, y + 2); ctx.lineTo(j, y + h - 2); ctx.stroke();
}
ctx.restore();
}

function cap(ctx, cx, cy, rx, ry, hi, mid) {
var g = ctx.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry);
g.addColorStop(0, hi); g.addColorStop(1, mid);
ctx.save();
ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
ctx.fillStyle = g; ctx.fill();
ctx.strokeStyle = C.dLo; ctx.lineWidth = 1; ctx.stroke();
ctx.restore();
}

function halo(ctx, x, y, r, color, a) {
ctx.save();
ctx.globalAlpha = a == null ? 0.18 : a; ctx.fillStyle = color;
ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}

function head(ctx, W, title, sub) {
txt(ctx, title, 22, 24, { size: 16, color: C.white, weight: 600, align: 'left' });
if (sub) { txt(ctx, sub, 22, 46, { size: 12, color: '#78909c', align: 'left' }); }
}

function clear(ctx, W, H) {
ctx.save();
var g = ctx.createLinearGradient(0, 0, 0, H);
g.addColorStop(0, '#f0f5fc'); g.addColorStop(1, '#ffffff');
ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
ctx.restore();
}

function caliper(ctx, W, H, st) {
clear(ctx, W, H);
var P = window.VizPhys, cfg = P.vcfg(st.div), k = cfg.k;
var r = P.vernier(st.x, st.div);

var compact0 = (H < 470) || (W < 560);
var mL = compact0 ? 40 : 56, mR = compact0 ? 40 : 56;
var winMM = compact0 ? 40 : 70;
var cx = st.x + winMM * 0.17;
var mm0 = cx - winMM / 2, mm1 = cx + winMM / 2;
if (mm0 < -4) { mm0 = -4; mm1 = mm0 + winMM; }
if (mm1 > CAL_MM + 4) { mm1 = CAL_MM + 4; mm0 = mm1 - winMM; }
var pxmm = (W - mL - mR) / winMM;
var X = function (mm) { return mL + (mm - mm0) * pxmm; };

var compact = (H < 470) || (W < 560);

var zoomH = compact ? 0 : clamp(H * 0.34, 130, 330);
var zoomTop = H - 32 - zoomH;
var msgH = compact ? 26 : 32;
var bodyTop = compact ? 34 : 62, bodyBot = zoomTop - msgH - (compact ? 6 : 4);
var bodyH = bodyBot - bodyTop;

var beamH = clamp(H * 0.075, 34, 78);
var jawH = beamH * 3.0;
var instrH = beamH + jawH;
var yBeam = bodyTop + Math.max(0, (bodyH - instrH) * 0.44);
var yJawBot = yBeam + instrH;
var msgY = bodyBot + msgH * 0.5 + 2;

if (compact) {
txt(ctx, '游标卡尺 · ' + cfg.k + ' 分度 · ' + P.fmtCaliper(r) + ' mm',
14, 18, { size: 13, color: C.white, weight: 600, align: 'left' });
} else {
head(ctx, W, '游标卡尺（实物）· ' + cfg.k + ' 分度 · 量程 0 ~ ' + CAL_MM + ' mm',
'真实比例 1 mm = ' + pxmm.toFixed(1) + ' px　·　精度 ' + cfg.precision.toFixed(2) +
' mm　·　镜头跟随游标滑块　·　拖它去卡住被测物');
}

var bx0 = mL - 14, bx1 = W - mR + 14;
var bgImg = img('caliper');
if (ready(bgImg)) {
ctx.save();
rrectPath(ctx, bx0, yBeam, bx1 - bx0, beamH, 2);
ctx.clip();

ctx.drawImage(bgImg, 30, 58, bgImg.naturalWidth - 34, 45,
bx0, yBeam, bx1 - bx0, beamH);
ctx.restore();
} else {
metal(ctx, bx0, yBeam, bx1 - bx0, beamH, 2, C.mHi, C.mMid, C.mLo);
sheen(ctx, bx0, yBeam + 2, bx1 - bx0, 0.42);
}

var i, xp, hh;
for (i = Math.max(0, Math.floor(mm0)); i <= Math.min(CAL_MM, Math.ceil(mm1)); i++) {
xp = X(i);
hh = (i % 10 === 0) ? beamH * 0.48 : (i % 5 === 0 ? beamH * 0.33 : beamH * 0.21);
seg(ctx, xp, yBeam + beamH - 1, xp, yBeam + beamH - 1 - hh, C.dLo,
i % 5 === 0 ? 1.2 : 0.8, null, i % 5 === 0 ? 0.95 : 0.68);
if (i % (compact ? 20 : 10) === 0 && xp < W - mR - 76) {
txt(ctx, String(i), xp, yBeam + beamH * 0.30, { size: compact ? 10 : 11, color: C.dLo, weight: 600 });
}
}
if (!compact) {
txt(ctx, 'mm', bx0 + 6, yBeam - 11, { size: 11, color: C.grey2, weight: 600, align: 'left' });
txt(ctx, '窗口 ' + mm0.toFixed(0) + ' ~ ' + mm1.toFixed(0) + ' mm',
bx1 - 6, yBeam - 11, { size: 11, color: '#78909c', align: 'right' });
}

var jawW = clamp(pxmm * 1.6, 6, 18);
var lipH = jawH * 0.30;
var yLip = yJawBot - lipH;

var xFix = X(0);
var lipL = clamp(jawW * 1.2, 8, 22);
metal(ctx, xFix - jawW, yBeam + beamH - 2, jawW, jawH - beamH * 0.6, 2, C.dHi, C.dMid, C.dLo);

metal(ctx, xFix - lipL, yLip, lipL, lipH, 2, C.dHi, C.dMid, C.dLo);

var pad = 12;
var sx0 = X(r.x) - pad, sx1 = X(r.x + cfg.span) + pad;
var sy0 = yBeam - 6, sy1 = yBeam + beamH + 6;

metal(ctx, sx0, sy0, sx1 - sx0, sy1 - sy0, 3, C.mHi, C.mMid, C.mLo);
sheen(ctx, sx0, sy0 + 2, sx1 - sx0, 0.55);
knurl(ctx, sx0 + 3, sy0 + 3, 9, sy1 - sy0 - 6, 3, 0.32);
knurl(ctx, sx1 - 12, sy0 + 3, 9, sy1 - sy0 - 6, 3, 0.32);

var n, xv, isAl, isZero, col, hh2;
for (n = 0; n <= k; n++) {
xv = X(r.x + n * (k - 1) / k);
if (xv < sx0 + 2 || xv > sx1 - 2) { continue; }
isAl = (n === r.idx && st.flags && st.flags.hiAlign);
isZero = (n === 0);
col = (isAl || isZero) ? C.yellow : C.dLo;
hh2 = (n % 5 === 0) ? beamH * 0.46 : beamH * 0.28;
if (isZero || isAl) { hh2 = beamH * 0.60; }
seg(ctx, xv, sy1 - 1, xv, sy1 - 1 - hh2, col,
(isZero || isAl) ? 2.2 : (n % 5 === 0 ? 1.2 : 0.8), null, 1);
if (isAl) { halo(ctx, xv, sy1 - hh2 * 0.6, 10, C.yellow, 0.22); }
if (n % (compact ? 10 : 5) === 0 || isAl) {
txt(ctx, String(n), xv, sy1 + (compact ? 11 : 13),
{ size: compact ? 9.5 : 10, color: (isZero || isAl) ? C.yellow : C.dLo, weight: (isZero || isAl) ? 700 : 400 });
}
}

var xMov = X(r.x);
metal(ctx, xMov, sy1 - 3, jawW, jawH - beamH * 0.5, 2, C.dHi, C.dMid, C.dLo);

metal(ctx, xMov, yLip, lipL, lipH, 2, C.dHi, C.dMid, C.dLo);

var objW = st.objectMM != null ? st.objectMM : r.total;

var ox0 = X(0), ox1 = X(objW);

ox0 += 1; ox1 -= 1;
if (ox1 <= ox0) { ox1 = ox0 + 2; }
var oy1 = yJawBot - 2, oy0 = yLip + lipH * 0.16;
var fitted = Math.abs(r.x - objW) <= cfg.precision * 0.5 + 1e-9;
{
ctx.save();
rrectPath(ctx, ox0, oy0, ox1 - ox0, oy1 - oy0, 2);
var og = ctx.createLinearGradient(0, oy0, 0, oy1);
og.addColorStop(0, C.goldLo); og.addColorStop(0.28, C.goldHi);
og.addColorStop(0.54, C.gold); og.addColorStop(1, C.goldLo);
ctx.fillStyle = og; ctx.fill();
ctx.strokeStyle = fitted ? C.yellow : C.goldLo;
ctx.lineWidth = fitted ? 2.4 : 1; ctx.stroke();
ctx.restore();
if (fitted) { halo(ctx, (ox0 + ox1) / 2, (oy0 + oy1) / 2, 30, C.yellow, 0.15); }

if (st.flags && st.flags.dimJaw && !compact) {
var ym = yJawBot + 18;
seg(ctx, ox0, ym, ox1, ym, C.gold, 1.4, null, 0.95);
seg(ctx, ox0, ym - 5, ox0, ym + 5, C.gold, 1.4);
seg(ctx, ox1, ym - 5, ox1, ym + 5, C.gold, 1.4);
txt(ctx, '被测物 ' + objW.toFixed(cfg.dec) + ' mm',
(ox0 + ox1) / 2, ym + 15, { size: 11.5, color: C.gold, weight: 600 });
}
if (fitted) {
txt(ctx, '✓ 两爪已卡紧　→　读数 ' + P.fmtCaliper(r) + ' mm',
W / 2, msgY, { size: compact ? 11.5 : 13.5, color: C.yellow, weight: 700 });
} else if (r.x > objW) {
txt(ctx, '往左推游标滑块，让两爪刚好贴住被测物（现在还有 ' +
(r.x - objW).toFixed(cfg.dec) + ' mm 缝）',
W / 2, msgY, { size: compact ? 11 : 12.5, color: '#78909c' });
} else {
txt(ctx, '拖游标滑块，让两爪刚好贴住被测物',
W / 2, msgY, { size: compact ? 11 : 12.5, color: '#78909c' });
}
}

if (!compact) {

txt(ctx, '游标 0 线', xMov, yJawBot + 16, { size: 11, color: C.yellow, weight: 600 });
seg(ctx, xMov, sy1, xMov, yJawBot + 8, C.yellow, 1.2, [5, 4], 0.7);
}

if (!compact) { zoomStrip(ctx, st, r, W, H, zoomTop, zoomH, mL, mR, cfg, k); }
}

function zoomStrip(ctx, st, r, W, H, yTop, h, mL, mR, cfg, k) {
var P = window.VizPhys;
var boxW = W - mL - mR;
var winMM = 13;
var cxc = r.x + cfg.span / 2;
var mm0 = cxc - winMM / 2, mm1 = cxc + winMM / 2;
if (mm0 < -0.5) { mm0 = -0.5; mm1 = mm0 + winMM; }
if (mm1 > CAL_MM + 0.5) { mm1 = CAL_MM + 0.5; mm0 = mm1 - winMM; }
var pxmm = boxW / winMM;
var X = function (mm) { return mL + (mm - mm0) * pxmm; };

txt(ctx, '读数特写（×' + (pxmm / ((W - mL - mR) / CAL_MM)).toFixed(0) + '）',
mL, yTop - 13, { size: 11.5, color: '#78909c', align: 'left' });
txt(ctx, '窗口 ' + mm0.toFixed(1) + ' ~ ' + mm1.toFixed(1) + ' mm',
mL + boxW, yTop - 13, { size: 11.5, color: '#78909c', align: 'right' });

var beamH = clamp(h * 0.36, 36, 92);
var bandH = beamH * 1.46;
var yBeam = yTop + clamp((h - bandH - 40) * 0.45, 20, 90);
var i, xp, hh, n, xv, isAl, isZero, col, hh2;

ctx.save();
ctx.beginPath(); ctx.rect(mL - 2, yTop - 2, boxW + 4, h + 4); ctx.clip();

metal(ctx, X(-0.5), yBeam, X(CAL_MM + 0.5) - X(-0.5), beamH, 3, C.mHi, C.mMid, C.mLo);
sheen(ctx, X(-0.5), yBeam + 2, X(CAL_MM + 0.5) - X(-0.5), 0.42);
for (i = Math.floor(mm0); i <= Math.ceil(mm1); i++) {
if (i < 0 || i > CAL_MM) { continue; }
xp = X(i);
hh = (i % 10 === 0) ? beamH * 0.46 : (i % 5 === 0 ? beamH * 0.32 : beamH * 0.20);
seg(ctx, xp, yBeam + beamH - 1, xp, yBeam + beamH - 1 - hh, C.dLo,
i % 5 === 0 ? 1.2 : 0.8, null, i % 5 === 0 ? 0.95 : 0.7);
txt(ctx, String(i), xp, yBeam + beamH * 0.30,
{ size: 11.5, color: C.dLo, weight: 600 });
}

var sy0 = yBeam - (bandH - beamH) / 2, sy1 = yBeam + beamH + (bandH - beamH) / 2;
var sx0 = X(r.x) - 12, sx1 = X(r.x + cfg.span) + 12;
metal(ctx, sx0, sy0, sx1 - sx0, sy1 - sy0, 3, C.mHi, C.mMid, C.mLo);
sheen(ctx, sx0, sy0 + 2, sx1 - sx0, 0.55);

for (n = 0; n <= k; n++) {
xv = X(r.x + n * (k - 1) / k);
isAl = (n === r.idx && st.flags && st.flags.hiAlign);
isZero = (n === 0);
col = (isAl || isZero) ? C.yellow : C.dLo;
hh2 = (n % 5 === 0) ? beamH * 0.46 : beamH * 0.28;
if (isZero || isAl) { hh2 = beamH * 0.60; }
seg(ctx, xv, sy1 - 1, xv, sy1 - 1 - hh2, col,
(isZero || isAl) ? 2.2 : (n % 5 === 0 ? 1.2 : 0.8), null, 1);
if (isAl) { halo(ctx, xv, sy1 - hh2 * 0.6, 11, C.yellow, 0.24); }
if (n % 5 === 0) {
txt(ctx, String(n), xv, sy1 + 14,
{ size: 11, color: (isZero || isAl) ? C.yellow : C.dLo, weight: (isZero || isAl) ? 700 : 400 });
}
}

if (st.flags && st.flags.hiAlign) {
seg(ctx, X(r.mLine), yBeam + 2, X(r.mLine), sy1, C.yellow, 1.6, [3, 3], 0.9);
txt(ctx, '第 ' + r.idx + ' 条对齐　残差 ' + r.residual.toFixed(4) + ' mm',
X(r.mLine), sy1 + 34, { size: 11.5, color: C.yellow, weight: 600 });
}
ctx.restore();

txt(ctx, '主尺读数 ' + r.mainMM + ' mm　+　第 ' + r.idx + ' 条 × ' + cfg.precision +
' mm　=　' + P.fmtCaliper(r) + ' mm',
W / 2, yTop + h - 16, { size: 13.5, color: C.yellow, weight: 700 });
}

function micrometer(ctx, W, H, st) {
clear(ctx, W, H);
var P = window.VizPhys;
var r = P.micro(st.x);

var mL = 104, mR = 60;
var winMM = 12;
var mm0 = r.x - winMM * 0.66, mm1 = mm0 + winMM;
if (mm0 < -0.6) { mm0 = -0.6; mm1 = mm0 + winMM; }
if (mm1 > MIC_MM + 0.6) { mm1 = MIC_MM + 0.6; mm0 = mm1 - winMM; }
var pxmm = (W - mL - mR) / winMM;
var X = function (mm) { return mL + (mm - mm0) * pxmm; };

var miniH = clamp(H * 0.20, 84, 190);
var zoomH = clamp(H * 0.26, 108, 250);
var zoomTop = H - 30 - zoomH;
var miniTop = zoomTop - 40 - miniH;
var msgH = 32;
var bodyTop = 64, bodyBot = miniTop - msgH - 4;
var bodyH = bodyBot - bodyTop;

var sleeveHH = clamp(H * 0.075, 36, 84);
var thimbleHH = clamp(H * 0.110, 56, 128);
var instrH = thimbleHH * 2 + 30;
var yD = bodyTop + Math.max(0, (bodyH - instrH) * 0.48) + thimbleHH;
var msgY = bodyBot + msgH * 0.5 + 2;

head(ctx, W, '螺旋测微器（实物）· 螺距 0.5 mm · 量程 0 ~ ' + MIC_MM + ' mm',
'真实比例 1 mm = ' + pxmm.toFixed(0) + ' px　·　固定刻度 0.5 mm 一格　·　可动刻度 50 格 × 0.01 mm　·　读到 0.001 mm');

var jawBot = yD + thimbleHH + 22;
var sl0 = X(0);
if (mm0 < 3.2) {
var fx = sl0 - 30;
ctx.save();
ctx.strokeStyle = C.dMid; ctx.lineWidth = 16; ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(fx, yD - sleeveHH - 12);
ctx.lineTo(fx, jawBot - 60);
ctx.quadraticCurveTo(fx, jawBot, sl0 + 50, jawBot);
ctx.stroke();
ctx.strokeStyle = C.dHi; ctx.lineWidth = 11;
ctx.beginPath();
ctx.moveTo(fx, yD - sleeveHH - 12);
ctx.lineTo(fx, jawBot - 60);
ctx.quadraticCurveTo(fx, jawBot, sl0 + 50, jawBot);
ctx.stroke();
ctx.restore();

metal(ctx, sl0 - 22, yD - sleeveHH * 1.05, 24, sleeveHH * 2.1, 2, C.mHi, C.mMid, C.mLo);
} else {

txt(ctx, '← 测砧在左侧 ' + r.x.toFixed(1) + ' mm 处', mL, yD, { size: 11, color: '#78909c', align: 'left' });
}

var t0 = X(r.x), t1 = W - mR + 10;
metal(ctx, mL - 14, yD - sleeveHH, Math.max(4, t0 - (mL - 14)), sleeveHH * 2, 2, C.mHi, C.mMid, C.mLo);

var m, xp, isLast, xh, isLastH;
for (m = Math.max(0, Math.floor(mm0)); m <= Math.min(MIC_MM, Math.ceil(mm1)); m++) {
if (m > r.x + 1e-9) { break; }
xp = X(m);
isLast = (m + 1 > r.x + 1e-9);
seg(ctx, xp, yD - sleeveHH * 0.62, xp, yD - 5, isLast ? C.yellow : C.dLo,
isLast ? 2.6 : 1.3, null, 1);
txt(ctx, String(m), xp, yD - sleeveHH * 0.62 - 16,
{ size: 13, color: isLast ? C.yellow : C.dLo, weight: isLast ? 700 : 600 });
if (m < MIC_MM) {
xh = X(m + 0.5);
if (m + 0.5 <= r.x + 1e-9) {
isLastH = (m + 1.0 > r.x + 1e-9);
seg(ctx, xh, yD + 5, xh, yD + sleeveHH * 0.50, isLastH ? C.yellow : C.dLo,
isLastH ? 2.6 : 1.3, null, 1);
}
}
}
txt(ctx, '毫米线', mL - 20, yD - sleeveHH * 0.62, { size: 10.5, color: '#78909c', align: 'right' });
txt(ctx, '半毫米线', mL - 20, yD + sleeveHH * 0.50, { size: 10.5, color: '#78909c', align: 'right' });
txt(ctx, '基准线', mL + 5, yD + 15, { size: 10.5, color: '#78909c', align: 'left' });

for (m = Math.max(0, Math.floor(mm0)); m <= Math.min(MIC_MM, Math.ceil(mm1)); m++) {
if (m > r.x + 1e-9) { break; }
xp = X(m);
isLast = (m + 1 > r.x + 1e-9);
seg(ctx, xp, yD - sleeveHH * 0.62, xp, yD - 5, isLast ? C.yellow : C.dLo,
isLast ? 2.6 : 1.3, null, 1);
txt(ctx, String(m), xp, yD - sleeveHH * 0.62 - 16,
{ size: 13, color: isLast ? C.yellow : C.dLo, weight: isLast ? 700 : 600 });
if (m < MIC_MM) {
xh = X(m + 0.5);
if (m + 0.5 <= r.x + 1e-9) {
isLastH = (m + 1.0 > r.x + 1e-9);
seg(ctx, xh, yD + 5, xh, yD + sleeveHH * 0.50, isLastH ? C.yellow : C.dLo,
isLastH ? 2.6 : 1.3, null, 1);
}
}
}

var wireMM = st.objectMM != null ? st.objectMM : r.total;
var wx0 = Math.max(mL - 8, X(0) - 22), wx1 = X(r.x);

var wr = clamp((wireMM / 6.5) * sleeveHH, 3, sleeveHH * 0.34);
var fitted = Math.abs(r.x - wireMM) <= 0.0005;
if (wx1 > wx0 + 1) {
ctx.save();
var wg = ctx.createLinearGradient(0, yD - wr, 0, yD + wr);
wg.addColorStop(0, C.goldLo); wg.addColorStop(0.32, C.goldHi);
wg.addColorStop(0.55, C.gold); wg.addColorStop(1, C.goldLo);
ctx.beginPath(); ctx.rect(wx0, yD - wr, wx1 - wx0, wr * 2);
ctx.fillStyle = wg; ctx.fill();
ctx.strokeStyle = fitted ? C.yellow : C.goldLo;
ctx.lineWidth = fitted ? 2.2 : 1; ctx.stroke();
ctx.restore();
if (fitted) { halo(ctx, (wx0 + wx1) / 2, yD, 26, C.yellow, 0.13); }
txt(ctx, '被测金属丝 ' + wireMM.toFixed(3) + ' mm',
(wx0 + wx1) / 2, yD + wr + 16, { size: 11, color: C.gold, weight: 600 });
}

metal(ctx, t0, yD - thimbleHH, t1 - t0, thimbleHH * 2, 3, C.mHi, C.mMid, C.mLo);
sheen(ctx, t0, yD - thimbleHH + 2, t1 - t0, 0.5);
knurl(ctx, t1 - 58, yD - thimbleHH + 4, 50, thimbleHH * 2 - 8, 3.4, 0.42);
cap(ctx, t1, yD, 6, thimbleHH, C.mHi, C.mMid);

var gap = clamp(thimbleHH * 2 / 22, 7, 18);
var dc = r.div + r.est / 10;
var d, yd, vis, isCur, col2, len;
for (d = 0; d < P.MIC_DIV; d++) {
yd = yD - (d - dc) * gap;
if (yd < yD - thimbleHH + 6 || yd > yD + thimbleHH - 6) { continue; }

function micZoom(ctx, st, r, W, H, yTop, h, mL, mR, X0, pxmm0) {
var P = window.VizPhys;
var boxW = W - mL - mR;
var winMM = 6;
var cxc = r.x - winMM * 0.35;

var sleeveHH = clamp(h * 0.20, 26, 54);

var m, xp, isLast, xh, isLastH;

ctx.save();
ctx.beginPath(); ctx.rect(mL - 2, yTop - 2, boxW + 4, h + 4); ctx.clip();

var t0 = X(r.x);
metal(ctx, X(-0.3), yD - sleeveHH, Math.max(4, t0 - X(-0.3)), sleeveHH * 2, 2, C.mHi, C.mMid, C.mLo);
for (m = 0; m <= MIC_MM; m++) {

xp = X(m);
isLast = (m + 1 > r.x + 1e-9);
seg(ctx, xp, yD - sleeveHH * 0.60, xp, yD - 4, isLast ? C.yellow : C.dLo,
isLast ? 2.4 : 1.2, null, 1);

{ size: 12.5, color: isLast ? C.yellow : C.dLo, weight: isLast ? 700 : 600 });

if (m + 0.5 <= r.x + 1e-9) {
isLastH = (m + 1.0 > r.x + 1e-9);
seg(ctx, xh, yD + 4, xh, yD + sleeveHH * 0.46, isLastH ? C.yellow : C.dLo,
isLastH ? 2.4 : 1.2, null, 1);
}
}
}

metal(ctx, t0, yD - sleeveHH * 1.5, X(MIC_MM + 0.3) - t0, sleeveHH * 3, 3, C.mHi, C.mMid, C.mLo);
var gap = Math.max(7, Math.min(sleeveHH * 1.5 / 12, 20));

null, (d % 5 === 0 || vis) ? 1 : 0.75);
if (d % 5 === 0) {
txt(ctx, String(d), t0 + len + 14, yd,
{ size: 11.5, color: vis ? C.yellow : C.dLo, weight: vis ? 700 : 600 });
}
}
seg(ctx, X(-0.3), yD, t0 + 150, yD, C.dLo, 1.6, null, 0.85);
seg(ctx, t0, yD - sleeveHH * 1.5 - 10, t0, yD + sleeveHH * 1.5 + 8, C.yellow, 2.4);
ctx.restore();

txt(ctx, '固定刻度 ' + r.fixedMM.toFixed(1) + ' mm　+　可动 ' + r.div + ' × 0.01　+　估读 ' +
r.est + ' × 0.001　=　' + P.fmtMicro(r) + ' mm',
W / 2, yTop + h - 6, { size: 13, color: C.yellow, weight: 700 });
}

st.flags = { object: true, dimJaw: false, ribbon: false, hiAlign: false,

el.classList.toggle('hidden', !on);
if (on && st.rng && st.rng[k]) {
var rg = document.getElementById(def.id);
rg.min = st.rng[k][0]; rg.max = st.rng[k][1]; rg.step = st.rng[k][2];
rg.value = st[k];
} else if (on && k === 'x' && st.real) {
var rg2 = document.getElementById(def.id);
var lim = (st.inst === 'micrometer') ? P.MIC_MAX : P.CAL_MM;
rg2.min = 0; rg2.max = lim; rg2.step = (st.inst === 'micrometer') ? 0.001 : 0.02;
rg2.value = st.x;
}
}

var wd = document.getElementById('wrapDivBtn');
wd.classList.toggle('hidden', !(st.allow && st.allow.div));
var bs = wd.querySelectorAll('button');
for (i = 0; i < bs.length; i++) {
bs[i].classList.toggle('on', parseInt(bs[i].dataset.div, 10) === st.div);
}

var wz = document.getElementById('wrapZoomBtn');
var zoomOn = !!(st.allow && st.allow.zoom) && st.inst !== 'compare';
wz.classList.toggle('hidden', !zoomOn);
setTxt('lbZoom', '×' + st.zoom.toFixed(1), '');

var wk = document.getElementById('wrapKnob');
var knobOn = !!(st.allow && st.allow.x) && st.inst === 'micrometer' && st.real;
wk.classList.toggle('hidden', !knobOn);

var wq = document.getElementById('wrapQuizBtn');
wq.classList.toggle('hidden', !(st.allow && st.allow.quiz));

var wf = document.getElementById('wrapFine');
var fineOn = !!(st.allow && st.allow.x) && st.inst === 'micrometer';
wf.classList.toggle('hidden', !fineOn);

var lab = document.getElementById('lbXLab');
if (lab) { lab.textContent = (st.inst === 'micrometer') ? '微分筒位置' : '游标零线位置'; }
setTxt('lbX', sliderText(), '');
setTxt('lbZoom', '×' + st.zoom.toFixed(1), '');
setTxt('lbDiv', st.div + ' 分度', '');
}

function sliderText() {
if (st.inst === 'micrometer') { return st.x.toFixed(3) + ' mm'; }
return st.x.toFixed(2) + ' mm';
}

function syncSliders() {
var el = document.getElementById('rgX');
if (el && st.allow && st.allow.x) { el.value = st.x; }
el = document.getElementById('rgZoom');
if (el && st.allow && st.allow.zoom) { el.value = st.zoom; }
}

function buildToc() {
var nav = document.getElementById('toc');
var html = '', lastAct = '', i, d;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
if (d.act !== lastAct) {
if (lastAct) { html += '<span class="sep"></span>'; }
html += '<span class="grouplab">' + d.act.split(' · ')[0] + '</span>';
lastAct = d.act;
}
html += '<a data-go="' + i + '" title="' + esc(d.title) + '">' + (i + 1) + '</a>';
}
nav.innerHTML = html;
nav.addEventListener('click', function (e) {
var a = e.target.closest ? e.target.closest('a[data-go]') : null;
if (a) { goto(parseInt(a.dataset.go, 10)); }
});
}
function markToc() {
var as = document.querySelectorAll('#toc a');
for (var i = 0; i < as.length; i++) {
as[i].classList.toggle('on', parseInt(as[i].dataset.go, 10) === st.step);
}
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

/* ===================== 绘制 ===================== */
/* 唯一画布出口：按 real / inst 分派。所有交互都走这里，绝不直接调 R.draw */
function paint() {
if (st.real && RL && st.inst !== 'compare') {
RL[st.inst === 'micrometer' ? 'micrometer' : 'caliper'](ctx, W, H, st);
} else {
R.draw(ctx, W, H, st);
}
}

function draw() {
updatePanel();
markToc();
buildControls();
fitCanvas();
paint();
document.getElementById('actTag').textContent = st.act;
document.getElementById('stepTitle').textContent = st.title;
document.getElementById('stepSn').textContent = (st.step + 1) + ' / ' + S.STEPS.length;
document.getElementById('hint').innerHTML = st.hint;
var pr = document.getElementById('prog');
pr.firstElementChild.style.width = ((st.step + 1) / S.STEPS.length * 100) + '%';
}

/* ===================== 步骤机 ===================== */
function goto(i) {
S.apply(st, i);
quizGot = null; quizMsg = null; quizShown = false;
var inp = document.getElementById('quizIn');
if (inp) { inp.value = ''; }
if (st.quiz && st.quiz.on) { st.x = (st.inst === 'micrometer') ? P.newMicroS(st.quiz.seed) : P.newCaliperS(st.div, st.quiz.seed); }
draw();
syncSliders();
}
function next() { if (st.step < S.STEPS.length - 1) { goto(st.step + 1); } }
function prev() { if (st.step > 0) { goto(st.step - 1); } }

/* ===================== 交互 ===================== */
function bind() {
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnReset').onclick = function () { goto(st.step); };

document.getElementById('toc');

var rgX = document.getElementById('rgX');
rgX.addEventListener('input', function () {
st.x = clampX(parseFloat(rgX.value));
quizGot = null; quizMsg = null;
updatePanel(); buildControls(); paint();
});
var rgZoom = document.getElementById('rgZoom');
rgZoom.addEventListener('input', function () {
st.zoom = parseFloat(rgZoom.value);
updatePanel(); buildControls(); paint();
});

var wd = document.getElementById('wrapDivBtn');
wd.addEventListener('click', function (e) {
var b = e.target.closest ? e.target.closest('button[data-div]') : null;
if (!b) { return; }
var oldDiv = st.div, nd = parseInt(b.dataset.div, 10);
if (nd === oldDiv) { return; }
/* 换分度时保持「对齐线序号比例」不变，位置仍能完美对齐 */
var a0 = P.vernier(st.x, oldDiv);
st.div = nd;
st.x = P.newCaliperS(nd, Math.floor(st.x * 1000) + nd * 7919);
if (st.x < 0.2) { st.x = 0.2; }
quizGot = null; quizMsg = null;
draw(); syncSliders();
});

/* 缩放：放大 / 缩小 / 重置（步长 0.5，范围 1~5） */
document.getElementById('wrapZoomBtn').addEventListener('click', function (e) {
var b = e.target.closest ? e.target.closest('button[data-z]') : null;
if (!b) { return; }
var z = st.zoom;
if (b.dataset.z === 'in') { z = Math.min(5, z + 0.5); }
else if (b.dataset.z === 'out') { z = Math.max(1, z - 0.5); }
else { z = 1; }
st.zoom = z;
updatePanel(); buildControls(); syncSliders(); paint();
});

/* 旋钮：按住上下拖（粗调 0.01 mm/px，微调 0.001 mm/px） */
(function () {
var wrap = document.getElementById('wrapKnob');
var kn = null;
function start(mode) {
return function (e) {
kn = { mode: mode, y: e.clientY };
e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
};
}
function move(e) {
if (!kn) { return; }
var dy = kn.y - e.clientY;
kn.y = e.clientY;
var step = (kn.mode === 'coarse') ? 0.01 : 0.001;
st.x = clampX(st.x + dy * step * 0.5);
updatePanel(); syncSliders(); paint();
}
function end() { kn = null; }
var bs = wrap.querySelectorAll('button[data-knob]');
for (var i = 0; i < bs.length; i++) {
bs[i].addEventListener('pointerdown', start(bs[i].dataset.knob));
bs[i].addEventListener('pointermove', move);
bs[i].addEventListener('pointerup', end);
bs[i].addEventListener('pointercancel', end);
}
})();

document.getElementById('btnQuizNew').onclick = function () { newQuiz(); draw(); syncSliders(); };
document.getElementById('btnQuizCheck').onclick = checkQuiz;
document.getElementById('btnQuizAns').onclick = function () { quizShown = !quizShown; updatePanel(); };
document.getElementById('quizIn').addEventListener('keydown', function (e) {
if (e.key === 'Enter') { checkQuiz(); }
});

/* 微调按钮 */
var wf = document.getElementById('wrapFine');
wf.addEventListener('click', function (e) {
var b = e.target.closest ? e.target.closest('button[data-d]') : null;
if (!b) { return; }
st.x = clampX(st.x + parseFloat(b.dataset.d));
quizGot = null; quizMsg = null;
updatePanel(); buildControls(); syncSliders(); paint();
});

/* 画布拖拽 */
cv.addEventListener('pointerdown', function (e) {
/* 折叠按钮优先：命中就切换面板，不进入拖动 */
if (st.flags && st.flags.steps && R.stepsToggleBox) {
var rc = cv.getBoundingClientRect();
var mx = e.clientX - rc.left, my = e.clientY - rc.top;
var tb = R.stepsToggleBox(W);
if (mx >= tb.x && mx <= tb.x + tb.w && my >= tb.y && my <= tb.y + tb.h) {
st.ui = st.ui || {};
st.ui.stepsOpen = !st.ui.stepsOpen;
paint();
return;
}
}
if (!(st.allow && st.allow.drag)) { return; }
drag = { x: e.clientX };
cv.setPointerCapture(e.pointerId);
cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', function (e) {
if (!drag) { return; }
var dx = e.clientX - drag.x;
drag.x = e.clientX;
var perPx;
if (st.inst === 'micrometer') {
perPx = P.MIC_MAX / Math.max(60, W - 112) * (st.real ? 1 : 0.35);
} else if (st.real) {
perPx = P.CAL_MM / Math.max(60, W - 108) * 1;
} else {
perPx = (P.CAL_XMAX + P.vcfg(st.div).span + 3) / Math.max(60, W - 104) * 0.35;
}
st.x = clampX(st.x + dx * perPx);
quizGot = null; quizMsg = null;
updatePanel(); buildControls(); syncSliders(); paint();
});
cv.addEventListener('pointerup', function (e) {
drag = null; cv.style.cursor = '';
try { cv.releasePointerCapture(e.pointerId); } catch (err) { }
});
cv.addEventListener('pointercancel', function () { drag = null; cv.style.cursor = ''; });

document.addEventListener('keydown', function (e) {
if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) { return; }
if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
else if (e.key === 'Home') { goto(0); }
else if (e.key === 'End') { goto(S.STEPS.length - 1); }
});

window.addEventListener('resize', function () { fitCanvas(); paint(); });
}

/* ===================== 自检钩子 ===================== */
function hash() {
/* 注意：绝不调 fitCanvas()，复用 draw() 存下的尺寸（踩坑 8） */
if (!W || !H) { return 'empty'; }
var d = ctx.getImageData(0, 0, Math.min(W, cv.width), Math.min(H, cv.height)).data;
var h = 2166136261 >>> 0, i, step = 97;
for (i = 0; i < d.length; i += step * 4) {
h ^= d[i]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 1]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 2]; h = Math.imul(h, 16777619) >>> 0;
}
return (h >>> 0).toString(16);
}

function checkAllowConsistency() {
/* 验收第 5 条：hint 说能拖的，allow 里必须有 */
var bad = [], i, d, hint, allow;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i]; hint = d.hint || ''; allow = d.allow || {};
if (/游标零线位置|微分筒位置/.test(hint) && !allow.x) { bad.push('step' + (i + 1) + ': hint 提到位置滑杆，allow.x 缺失'); }
if (/放大|放大条/.test(hint) && !allow.zoom && !allow.drag) { bad.push('step' + (i + 1) + ': hint 提到放大，allow.zoom/drag 缺失'); }
if (/分度/.test(hint) && /点/.test(hint) && /10 \/ 20 \/ 50/.test(hint) && !allow.div) { bad.push('step' + (i + 1) + ': hint 提到分度切换，allow.div 缺失'); }
var negated = /不用拖|不需要拖|无需拖|不用再拖/.test(hint);
if (/拖|拖动/.test(hint) && !negated && !allow.drag && !allow.x) { bad.push('step' + (i + 1) + ': hint 说了拖动，allow 无 drag/x'); }
if (/随机出题|核对/.test(hint) && !allow.quiz) { bad.push('step' + (i + 1) + ': hint 提到出题/核对，allow.quiz 缺失'); }
}
return { ok: bad.length === 0, bad: bad };
}

window.__viz = {
selfTest: function () {
var p = P.runSelfTest();
var c = checkAllowConsistency();
var fails = p.fails.slice();
var n = p.nfail + (c.ok ? 0 : c.bad.length);
if (!c.ok) { fails = fails.concat(c.bad); }
return { pass: n === 0, cases: p.cases, nfail: n, fails: fails.slice(0, 12) };
},
hash: hash,
goto: goto, next: next, prev: prev,
state: function () { return st; },
setX: function (v) { st.x = v; draw(); },
answer: answerText,
checkAllow: checkAllowConsistency,
steps: S.STEPS.length,
diag: function () { return { W: W, H: H, cw: cv.width, ch: cv.height, inst: st.inst, step: st.step }; }
};

/* ===================== 启动 ===================== */
buildToc();
bind();
goto(0);
window.addEventListener('load', function () { fitCanvas(); paint(); });
})();

</script>
</body>
</html>
